<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WonderBox Kids — Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <header class="site-header">
    <div class="container header-row">
      <div class="logo"><a href="index.html" aria-label="WonderBox Kids home"><img src="assets/logo.svg" alt="WonderBox Kids logo"></a></div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="categories.html">Categories</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="actions">
        <a href="wishlist.html" class="icon" aria-label="Wishlist">♡ <span id="wish-count">0</span></a>
        <a href="cart.html" class="icon" aria-label="Cart">🛒 <span id="cart-count">0</span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-content">
        <h1>WonderBox Kids</h1>
        <p>Playful toys that spark imagination — curated for curious little minds.</p>
        <p><a class="btn" href="products.html">Shop Now</a></p>
      </div>
      <div class="hero-image" role="img" aria-label="Kids playing with toys"></div>
    </section>

    <section class="features">
      <h2>Featured Picks</h2>
      <div id="featured-grid" class="grid"></div>
    </section>

    <section class="newsletter">
      <h2>Join our newsletter</h2>
      <form id="newsletter-form" class="inline-form">
        <input id="newsletter-email" type="email" placeholder="Your email" required>
        <button class="btn" type="submit">Subscribe</button>
      </form>
      <p id="newsletter-msg" class="muted"></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> WonderBox Kids — Play, Learn, Grow</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
