<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </header>
    <section class="hero">
        <img src="https://images.unsplash.com/photo-1587654562363-6054a493c3d6?w=600&auto=format&fit=crop" alt="Building Blocks" style="width:100%; max-height: 400px; object-fit: cover;">
        <h1>Welcome to Our Store</h1>
        <p>Discover amazing products below</p>
    </section>
    <main class="product-grid">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1503602642458-232111445657?auto=format&fit=crop&w=400&q=80" alt="Product 1">
            <h3>Product 1</h3>
            <p class="price">$19.99</p>
            <button class="btn">Buy Now</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1513708926084-555e5e50d055?auto=format&fit=crop&w=400&q=80" alt="Product 2">
            <h3>Product 2</h3>
            <p class="price">$29.99</p>
            <button class="btn">Buy Now</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=400&q=80" alt="Product 3">
            <h3>Product 3</h3>
            <p class="price">$39.99</p>
            <button class="btn">Buy Now</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=400&q=80" alt="Product 4">
            <h3>Product 4</h3>
            <p class="price">$49.99</p>
            <button class="btn">Buy Now</button>
        </div>
    </main>
    <footer class="footer" style="text-align:center; padding:1rem; background:#0284c7; color:white;">
        &copy; 2024 Our Store. All rights reserved.
    </footer>
</body>
</html>
