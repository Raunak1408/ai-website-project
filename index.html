<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew & Bean - Coffee Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="hero">
            <h1>Welcome to Brew & Bean</h1>
            <p>Your favorite coffee shop.</p>
        </div>
        <nav class="nav-links">
            <ul>
                <li><a href="#about">About Us</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#contact">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="about" class="about-us">
            <h2>About Us</h2>
            <p>At Brew & Bean, we serve the finest coffee in a cozy atmosphere.</p>
        </section>
        <section id="menu" class="menu">
            <h2>Menu</h2>
            <div class="menu-grid">
                <div class="menu-item">
                    <h3>Espresso</h3>
                    <p>$3.00</p>
                </div>
                <div class="menu-item">
                    <h3>Latte</h3>
                    <p>$4.00</p>
                </div>
                <div class="menu-item">
                    <h3>Cappuccino</h3>
                    <p>$4.50</p>
                </div>
                <div class="menu-item">
                    <h3>Mocha</h3>
                    <p>$5.00</p>
                </div>
            </div>
        </section>
        <section id="contact" class="contact-us">
            <h2>Contact Us</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Brew & Bean</p>
    </footer>
</body>
</html>
