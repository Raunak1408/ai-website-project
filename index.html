<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToyLand World - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ToyLand World</h1>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Welcome to ToyLand World!</h2>
        <p>Discover the best handcrafted and educational toys for kids.</p>
        <a href="products.html" class="btn">Shop Now</a>
    </section>

    <main>
        <section class="featured-products">
            <h2>Featured Products</h2>
            <div class="product-cards">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1596464716121-9ae70f2830c1?auto=format&fit=crop&w=600&h=400" alt="Wooden Building Blocks">
                    <h3>Wooden Building Blocks</h3>
                    <p class="price">$24.99</p>
                    <button class="btn">Add to Cart</button>
                </div>
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1559454403-b8fb88521f11?auto=format&fit=crop&w=600&h=400" alt="Cute Plush Teddy Bear">
                    <h3>Cute Plush Teddy Bear</h3>
                    <p class="price">$18.50</p>
                    <button class="btn">Add to Cart</button>
                </div>
            </div>
            <a href="products.html" class="btn view-all">View All Products</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ToyLand World. All Rights Reserved.</p>
    </footer>
</body>
</html>
