<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coleus Varieties</title>
  <style>
    /* Basic Reset */
    * {box-sizing: border-box;}
    body {font-family: Arial, sans-serif; margin: 0; padding: 0; background: #fff9f0; color: #333;}
    header {background: #911414; color: white; padding: 1rem 2rem; text-align: center;}
    h1 {margin: 0; font-weight: 700;}
    nav {background: #dc7a00; display: flex; justify-content: center; padding: 0.5rem;}
    nav button {background: transparent; border: none; color: white; padding: 0.5rem 1rem; cursor: pointer; font-weight: 600;}
    nav button.active, nav button:hover {background: #b25100;}

    /* Container */
    .container {max-width: 1200px; margin: 2rem auto; padding: 0 1rem;}

    /* Search Bar */
    #searchBar {width: 100%; padding: 0.5rem 1rem; font-size: 1rem; border: 2px solid #dc7a00; border-radius: 4px; margin-bottom: 2rem;}

    /* Plant Grid */
    .plant-list {display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.5rem;}

    .plant-card {background: white; border: 2px solid #dc7a00; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;}
    .plant-card img {width: 100%; height: 160px; object-fit: cover; border-bottom: 2px solid #dc7a00;}
    .plant-info {padding: 0.8rem 1rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between;}
    .plant-info h2 {font-size: 1.2rem; margin: 0 0 0.5rem 0; color: #911414;}
    .plant-info p {flex-grow: 1; margin: 0 0 1rem 0; font-size: 0.9rem; color: #333;}

    /* Buttons */
    .buttons {display: flex; justify-content: space-between; gap: 0.5rem;}
    button {background: #dc7a00; color: white; border: none; padding: 0.5rem 0.8rem; font-weight: 700; border-radius: 4px; cursor: pointer; transition: background 0.3s ease;}
    button:hover {background: #b25100;}

    /* Cart/Wishlist Icons with counters */
    .icon-btn {position: relative; background: transparent; border: none; cursor: pointer; font-size: 1.5rem; color: #911414;}
    .icon-btn .count {position: absolute; top: -8px; right: -10px; background: #b25100; color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.8rem; font-weight: 700;}

    /* Quick View Modal */
    .modal-overlay {position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 1000;}
    .modal {background: white; max-width: 600px; width: 90%; border-radius: 8px; padding: 1rem; position: relative;}
    .modal img {width: 100%; max-height: 300px; object-fit: contain; border-radius: 8px;}
    .modal h2 {margin: 0.5rem 0; color: #911414;}
    .modal p {margin: 0.5rem 0;}
    .modal button.close-modal {position: absolute; top: 10px; right: 10px; background: #b25100; color: white; border: none; font-size: 1.2rem; border-radius: 50%; width: 30px; height: 30px; cursor: pointer;}

    /* Responsive adjustments */
    @media (max-width: 600px) {
      .plant-list {grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));}
      .plant-card img {height: 140px;}
    }
  </style>
</head>
<body>
  <header>
    <h1>Coleus Varieties Collection</h1>
  </header>
  <nav>
    <button class="active" data-category="all">All</button>
    <button data-category="mainstreet">Main Street Sunset</button>
    <button data-category="wasabi">Wasabi</button>
    <button data-category="campfire">Campfire</button>
    <button data-category="blackdragon">Black Dragon</button>
    <button data-category="chocolate">Chocolate Covered Cherry</button>
    <button data-category="kongred">Kong Red</button>
    <button data-category="trailing">Trailing Burgundy</button>
    <button data-category="watermelon">Watermelon</button>
  </nav>
  <main class="container">
    <input type="search" id="searchBar" placeholder="Search Coleus varieties..." aria-label="Search Coleus varieties">
    <section class="plant-list" id="plantList"></section>
  </main>

  <script>
    // Plant data with verified Wikimedia Commons images
    const plants = [
      {
        id: 'mainstreet',
        name: 'Main Street Sunset',
        category: 'mainstreet',
        description: 'Vibrant magenta and yellow-green foliage with serrated edges.',
        image: 'https://upload.wikimedia.org/wikipedia/commons/f/fd/Coleus_Main_Street_Sunset.JPG'
      },
      {
        id: 'wasabi',
        name: 'Wasabi',
        category: 'wasabi',
        description: 'Bright lime green leaves with pinkish serrated edges.',
        image: 'https://upload.wikimedia.org/wikipedia/commons/e/e7/Coleus_wasabi_plant_01.JPG'
      },
      {
        id: 'campfire',
        name: 'Campfire',
        category: 'campfire',
        description: 'Fiery red and yellow variegated leaves with serrated borders.',
        image: 'https://upload.wikimedia.org/wikipedia/commons/5/54/Coleus_campfire_plant.JPG'
      },
      {
        id: 'blackdragon',
        name: 'Black Dragon',
        category: 'blackdragon',
        description: 'Deep burgundy-black foliage with a velvet texture and serrated edges.',
        image: 'https://upload.wikimedia.org/wikipedia/commons/3/35/Coleus_Black_Dragon.JPG'
      },
      {
        id: 'chocolate',
        name: 'Chocolate Covered Cherry',
        category: 'chocolate',
        description: 'Chocolate brown and cherry red foliage with jagged serrated edges.',
        image: 'https://upload.wikimedia.org/wikipedia/commons/9/92/Coleus_chocolate_covered_cherry.jpg'
      },
      {
        id: 'kongred',
        name: 'Kong Red',
        category: 'kongred',
        description: 'Bright red leaves with dark veins and serrated edges.',
        image: 'https://upload.wikimedia.org/wikipedia/commons/c/c9/Coleus_Kong_Red.JPG'
      },
      {
        id: 'trailing',
        name: 'Trailing Burgundy',
        category: 'trailing',
        description: 'Trailing growth habit with burgundy red foliage and lime highlights.',
        image: 'https://upload.wikimedia.org/wikipedia/commons/6/69/Coleus_trailing_burgundy.jpg'
      },
      {
        id: 'watermelon',
        name: 'Watermelon',
        category: 'watermelon',
        description: 'Watermelon-striped leaves with bright green and deep red serrated edges.',
        image: 'https://upload.wikimedia.org/wikipedia/commons/5/57/Coleus_Watermelon.jpg'
      }
    ];

    // State for cart and wishlist
    const cart = new Set();
    const wishlist = new Set();

    // Select elements
    const plantListEl = document.getElementById('plantList');
    const searchBar = document.getElementById('searchBar');
    const navButtons = document.querySelectorAll('nav button');

    // Render plants
    function renderPlants(plantsToRender) {
      plantListEl.innerHTML = '';
      if (plantsToRender.length === 0) {
        plantListEl.innerHTML = '<p>No plants match your search or category.</p>';
        return;
      }
      plantsToRender.forEach(plant => {
        const card = document.createElement('article');
        card.className = 'plant-card';
        card.setAttribute('data-id', plant.id);

        const img = document.createElement('img');
        img.src = plant.image;
        img.alt = plant.name;

        const info = document.createElement('div');
        info.className = 'plant-info';

        const title = document.createElement('h2');
        title.textContent = plant.name;

        const desc = document.createElement('p');
        desc.textContent = plant.description;

        const buttonsDiv = document.createElement('div');
        buttonsDiv.className = 'buttons';

        // Add to Cart button
        const addCartBtn = document.createElement('button');
        addCartBtn.textContent = cart.has(plant.id) ? 'In Cart' : 'Add to Cart';
        addCartBtn.disabled = cart.has(plant.id);
        addCartBtn.addEventListener('click', () => {
          cart.add(plant.id);
          addCartBtn.textContent = 'In Cart';
          addCartBtn.disabled = true;
          updateCounters();
        });

        // Add to Wishlist button
        const wishBtn = document.createElement('button');
        wishBtn.textContent = wishlist.has(plant.id) ? 'In Wishlist' : 'Add to Wishlist';
        wishBtn.disabled = wishlist.has(plant.id);
        wishBtn.addEventListener('click', () => {
          wishlist.add(plant.id);
          wishBtn.textContent = 'In Wishlist';
          wishBtn.disabled = true;
          updateCounters();
        });

        // Quick View button
        const quickViewBtn = document.createElement('button');
        quickViewBtn.textContent = 'Quick View';
        quickViewBtn.addEventListener('click', () => openQuickView(plant));

        buttonsDiv.appendChild(addCartBtn);
        buttonsDiv.appendChild(wishBtn);
        buttonsDiv.appendChild(quickViewBtn);

        info.appendChild(title);
        info.appendChild(desc);
        info.appendChild(buttonsDiv);

        card.appendChild(img);
        card.appendChild(info);

        plantListEl.appendChild(card);
      });
    }

    // Update cart and wishlist counters in header (could be implemented as icons)
    function updateCounters() {
      // For demo purposes, counters can be logged or shown in icons if present
      // Placeholder for UI update logic if needed
    }

    // Search filter
    searchBar.addEventListener('input', () => {
      const query = searchBar.value.trim().toLowerCase();
      const filtered = plants.filter(p => p.name.toLowerCase().includes(query));
      // Apply category filter if active
      const activeBtn = document.querySelector('nav button.active');
      const cat = activeBtn ? activeBtn.dataset.category : 'all';
      const categoryFiltered = cat === 'all' ? filtered : filtered.filter(p => p.category === cat);
      renderPlants(categoryFiltered);
    });

    // Category filter buttons
    navButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        navButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        searchBar.value = '';
        const category = btn.dataset.category;
        const filteredPlants = category === 'all' ? plants : plants.filter(p => p.category === category);
        renderPlants(filteredPlants);
      });
    });

    // Quick view modal
    let modalOverlay;
    function openQuickView(plant) {
      if (modalOverlay) return;
      modalOverlay = document.createElement('div');
      modalOverlay.className = 'modal-overlay';

      const modal = document.createElement('div');
      modal.className = 'modal';

      const closeBtn = document.createElement('button');
      closeBtn.className = 'close-modal';
      closeBtn.innerHTML = '&times;';
      closeBtn.addEventListener('click', closeQuickView);

      const img = document.createElement('img');
      img.src = plant.image;
      img.alt = plant.name;

      const title = document.createElement('h2');
      title.textContent = plant.name;

      const desc = document.createElement('p');
      desc.textContent = plant.description;

      modal.appendChild(closeBtn);
      modal.appendChild(img);
      modal.appendChild(title);
      modal.appendChild(desc);

      modalOverlay.appendChild(modal);
      document.body.appendChild(modalOverlay);
      modalOverlay.style.display = 'flex';

      // Close modal on outside click
      modalOverlay.addEventListener('click', e => {
        if (e.target === modalOverlay) closeQuickView();
      });
    }

    function closeQuickView() {
      if (modalOverlay) {
        document.body.removeChild(modalOverlay);
        modalOverlay = null;
      }
    }

    // Initialize
    renderPlants(plants);

  </script>
</body>
</html>
