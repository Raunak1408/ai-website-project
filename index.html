<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Find Your Next Watch or Read</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="hero-grid">
        <div>
          <h1>Find Your Next Watch or Read</h1>
          <div class="subtitle">Personalized movie and book recommendations based on genre, mood and rating.</div>
        </div>
        <nav class="mode-toggle" role="tablist" aria-label="Choose catalog">
          <button id="btn-movies" class="mode-btn active" aria-pressed="true">🎬 Movies</button>
          <button id="btn-books" class="mode-btn" aria-pressed="false">📚 Books</button>
        </nav>
      </div>
    </header>

    <main class="main-grid">
      <aside class="filter-card" aria-labelledby="filters-title">
        <h2 id="filters-title">Filters</h2>
        <form id="filters" class="contact-form-wrap" role="form">
          <label for="genre">Genre</label>
          <select id="genre" name="genre" aria-label="Genre" />

          <label for="mood">Mood</label>
          <select id="mood" name="mood" aria-label="Mood">
            <!-- options populated from data.js -->
          </select>

          <label for="minRating">Minimum rating</label>
          <div class="range-row">
            <input type="range" id="minRating" name="minRating" min="0" max="10" step="0.1" value="0">
            <span id="ratingValue" class="rating-value">0</span>
          </div>

          <div class="btn-row">
            <button type="button" id="getBtn" class="btn primary">Get Recommendations</button>
            <button type="button" id="resetBtn" class="btn secondary">Reset Filters</button>
          </div>
        </form>
      </aside>

      <section class="results-area">
        <div class="controls-top">
          <div id="statusArea" class="status-area"></div>
          <div id="resultsCount" class="results-count" aria-live="polite"></div>
        </div>

        <div id="loading" class="loading" hidden>
          <div class="spinner" aria-hidden="true"></div>
          <div class="loading-text">Finding matches…</div>
        </div>

        <div id="results" class="results-grid" aria-live="polite"></div>

        <div id="emptyState" class="empty-state" hidden>
          <strong>No matches found</strong>
          <div class="muted">Try different filters or reset to see recommendations.</div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">Made with care — "Recommendation Engine" demo</div>
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
