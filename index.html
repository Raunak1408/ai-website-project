<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToyLand World</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        <a href="#cart" class="cart-link">Cart (0)</a>
    </header>
    <section class="hero">
        <h1>Welcome to ToyLand World!</h1>
        <p>Discover amazing products below</p>
    </section>
    <main class="product-grid" id="products">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1587654562363-6054a493c3d6?w=600" alt="Wooden Building Blocks">
            <h3>Wooden Building Blocks</h3>
            <p class="price">$24.99</p>
            <button class="btn">Add to Cart</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1559454403-b8fb88521f11?w=600" alt="Cute Teddy Bear">
            <h3>Cute Teddy Bear</h3>
            <p class="price">$18.50</p>
            <button class="btn">Add to Cart</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1594787318286-3d835c1d207f?w=600" alt="Speed Racer Toy Car">
            <h3>Speed Racer Toy Car</h3>
            <p class="price">$15.00</p>
            <button class="btn">Add to Cart</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?w=600" alt="Kids Board Game">
            <h3>Kids Board Game</h3>
            <p class="price">$29.99</p>
            <button class="btn">Add to Cart</button>
        </div>
    </main>
    <footer class="footer">
        &copy; 2024 Our Store. All rights reserved.
    </footer>
</body>
</html>
