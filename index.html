<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Toykart - Toys for Every Child</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="hero-grid container">
      <div class="logo">Toykart</div>
      <nav class="main-nav">
        <a href="index.html" class="active">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart <span class="cart-count">0</span></a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-content">
        <h1>Big Toy Sale - Up to 50% off selected toys!</h1>
        <p>Free shipping on orders above 5000. Handpicked toys for learning and fun.</p>
        <a href="products.html" class="btn btn-primary">Shop Toys</a>
      </div>
      <img class="hero-img" src="https://picsum.photos/seed/hero/1200/700" alt="kids playing with toys">
    </section>

    <section class="categories">
      <button class="cat-btn" data-cat="Action Figures">Action Figures</button>
      <button class="cat-btn" data-cat="Soft Toys">Soft Toys</button>
      <button class="cat-btn" data-cat="Educational Toys">Educational Toys</button>
      <button class="cat-btn" data-cat="Remote Control Toys">Remote Control</button>
      <button class="cat-btn" data-cat="Puzzles">Puzzles</button>
    </section>

    <section class="features">
      <h2>Featured Toys</h2>
      <div id="featured-grid" class="featured-grid"></div>
    </section>

  </main>

  <footer class="site-footer container">
    <div>© Toykart - Toys only store</div>
    <nav>
      <a href="#">Terms</a>  <a href="#">Privacy</a>
    </nav>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script>
    // quick category click links
    document.querySelectorAll('.cat-btn').forEach(b=> b.addEventListener('click', ()=>{
      const cat = b.dataset.cat;
      const url = new URL(location.origin + '/products.html');
      url.searchParams.set('category', cat);
      location.href = url.toString();
    }));
  </script>
</body>
</html>
