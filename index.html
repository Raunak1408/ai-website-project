<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxury Horology E-Commerce</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>Luxury Horology Boutique</h1>
        <div class="filters">
            <input type="text" id="search" placeholder="Search by brand or model..." aria-label="Search Watches" />
            <div class="brand-filters">
                <button class="brand-btn active" data-brand="all">All</button>
                <button class="brand-btn" data-brand="Rolex">Rolex</button>
                <button class="brand-btn" data-brand="Omega">Omega</button>
                <button class="brand-btn" data-brand="Seiko">Seiko</button>
                <button class="brand-btn" data-brand="Casio">Casio</button>
                <button class="brand-btn" data-brand="TAG Heuer">TAG Heuer</button>
                <button class="brand-btn" data-brand="Tissot">Tissot</button>
                <button class="brand-btn" data-brand="Patek Philippe">Patek Philippe</button>
                <button class="brand-btn" data-brand="Audemars Piguet">Audemars Piguet</button>
                <button class="brand-btn" data-brand="Cartier">Cartier</button>
                <button class="brand-btn" data-brand="Tudor">Tudor</button>
            </div>
            <select id="sort">
                <option value="default">Sort By</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="brand">Brand Name</option>
                <option value="model">Model Name</option>
            </select>
        </div>
    </header>

    <main>
        <div id="products" class="product-grid">
            <!-- Product cards added dynamically by script.js -->
        </div>
    </main>

    <aside id="cart-panel" aria-label="Shopping Cart">
        <h2>Your Cart</h2>
        <div id="cart-items"></div>
        <div class="cart-footer">
            <div id="cart-total">Total: $0.00</div>
            <button id="clear-cart" aria-label="Clear Cart">Clear Cart</button>
        </div>
    </aside>

    <script src="script.js"></script>
</body>
</html>
