<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toyland World</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Toyland World</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Contact</a>
  </nav>
</header>
<section class="hero">
  <h2>Welcome to Toyland World</h2>
  <p>Your ultimate destination for the best toys in town!</p>
</section>
<section class="product-grid">
  <div class="card">
    <img src="https://images.unsplash.com/photo-1587654562363-6054a493c3d6?w=600" alt="Toy 1">
    <h3>Colorful Building Blocks</h3>
    <button class="btn">Buy Now</button>
  </div>
  <div class="card">
    <img src="https://images.unsplash.com/photo-1559454403-b8fb88521f11?w=600" alt="Toy 2">
    <h3>Fun Toy Car</h3>
    <button class="btn">Buy Now</button>
  </div>
</section>
</body>
</html>
