<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Our Products</h1>
    </header>
    <section class="hero">
        <h2>Discover Our Latest Collection</h2>
        <p>Quality products made just for you.</p>
    </section>
    <section class="product-grid">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1587654562363-6054a493c3d6?w=600" alt="Product 1">
            <h3>Product One</h3>
            <p>An excellent choice for your needs.</p>
            <button class="btn">Buy Now</button>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1559454403-b8fb88521f11?w=600" alt="Product 2">
            <h3>Product Two</h3>
            <p>Top quality with great features.</p>
            <button class="btn">Buy Now</button>
        </div>
    </section>
</body>
</html>
