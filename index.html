<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Find Your Next Watch or Read</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="hero-grid">
        <div>
          <h1>Find Your Next Watch or Read</h1>
          <div class="subtitle">Personalized movie and book recommendations tailored to your mood and taste.</div>
        </div>
      </div>

      <nav class="mode-toggle" role="tablist" aria-label="Choose type">
        <button id="btn-movies" class="active" aria-pressed="true">🎬 Movies</button>
        <button id="btn-books" aria-pressed="false">📚 Books</button>
      </nav>
    </header>

    <main class="main-grid">
      <aside class="filter-card" aria-label="Filters">
        <h2>Filters</h2>
        <form id="filters" class="contact-form-wrap">
          <div class="form-row">
            <label for="genre">Genre</label>
            <select id="genre" name="genre" aria-label="Genre">
              <!-- options populated from data.js -->
            </select>
          </div>

          <div class="form-row">
            <label for="mood">Mood</label>
            <select id="mood" name="mood" aria-label="Mood">
              <!-- options populated from data.js -->
            </select>
          </div>

          <div class="form-row">
            <label for="minRating">Minimum rating</label>
            <div class="range-value"><span class="muted">Select minimum</span><span id="ratingValue">0</span></div>
            <input type="range" id="minRating" name="minRating" min="0" max="10" step="0.1" value="0">
          </div>

          <div class="btn-row">
            <button id="getBtn" class="btn primary" type="button">Get Recommendations</button>
            <button id="resetBtn" class="btn secondary" type="button">Reset Filters</button>
          </div>
        </form>
      </aside>

      <section class="results-area">
        <div class="controls-top">
          <div id="statusArea" class="status-area" aria-hidden="true"></div>
          <div class="tiny muted" id="resultsCount" aria-live="polite"></div>
        </div>

        <div id="results" class="result-grid" aria-live="polite"></div>

        <div id="emptyState" class="empty-state" role="status" hidden>
          <strong>No matches found</strong>
          <div class="muted">Try adjusting filters or reset to see more recommendations.</div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <p>Made with care • Recommendation Engine demo</p>
      </div>
    </footer>
  </div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
