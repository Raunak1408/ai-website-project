<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToyLand World - Modern Toy Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ToyLand World</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="#products">Products</a>
            <a href="#contact">Contact</a>
            <a href="#cart">Cart (0)</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Welcome to ToyLand World!</h2>
        <p>Discover the best handcrafted and educational toys for kids.</p>
    </section>

    <main class="product-grid" id="products">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=600&auto=format&fit=crop" alt="Wooden Building Blocks">
            <h3>Wooden Building Blocks</h3>
            <p class="price">$24.99</p>
            <button class="btn">Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1559454403-b8fb88521f11?w=600&auto=format&fit=crop" alt="Cute Plush Teddy Bear">
            <h3>Cute Plush Teddy Bear</h3>
            <p class="price">$18.50</p>
            <button class="btn">Add to Cart</button>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?w=600&auto=format&fit=crop" alt="Kids Family Board Game">
            <h3>Kids Family Board Game</h3>
            <p class="price">$29.99</p>
            <button class="btn">Add to Cart</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ToyLand World. All Rights Reserved.</p>
    </footer>
</body>
</html>
