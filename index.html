<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayfulPaws Toys</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="hero">
            <h1>PlayfulPaws Toys</h1>
            <p>Bright, Fun, and Safe Toys for Your Pets</p>
            <button onclick="document.getElementById('products').scrollIntoView();">Shop Now</button>
        </div>
    </header>

    <div id="products" class="product-grid">
        <h2>Featured Products</h2>
        <div class="product-item">
            <img src="https://example.com/image1.jpg" alt="Product 1">
            <p>Product 1 - $10</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-item">
            <img src="https://example.com/image2.jpg" alt="Product 2">
            <p>Product 2 - $15</p>
            <button>Add to Cart</button>
        </div>
        <div class="product-item">
            <img src="https://example.com/image3.jpg" alt="Product 3">
            <p>Product 3 - $20</p>
            <button>Add to Cart</button>
        </div>
    </div>

    <section class="reviews">
        <h2>Customer Reviews</h2>
        <p>“My dog loves these toys!” - Happy Customer</p>
    </section>

    <footer>
        <h2>Sign Up for Our Newsletter</h2>
        <form>
            <input type="email" placeholder="Enter your email" required>
            <button type="submit">Subscribe</button>
        </form>
    </footer>

    <script src="script.js"></script>
</body>
</html>
