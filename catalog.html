<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ToyLand Magic - Shop Catalog</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body style="background-color: #fffdfa; font-family: 'Playfair Display', serif; color:#333;">

<header class="header">
  <nav class="navbar">
    <div class="logo" style="font-weight: 700; font-size: 1.8rem; cursor:pointer;">ToyLand Magic </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="catalog.html">Shop</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <input type="search" id="navbar-search" placeholder="Search toys..." aria-label="Search toys" />
    <div class="cart-icon">
      <a href="cart.html" title="Your Cart">
        <img src="https://images.unsplash.com/photo-1559454403-b8fb88521f11?auto=format&fit=crop&w=40&q=80" alt="Cart Icon" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1559454403-b8fb88521f11?auto=format&fit=crop&w=40&q=80';" />
        <span id="cart-badge" class="badge"></span>
      </a>
    </div>
  </nav>
</header>

<main style="margin:1rem;">
  <h1 style="color:#3b82f6;">Shop Catalog</h1>
  <section style="display:flex; justify-content:space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;">
    <div class="category-filter" style="flex-grow: 1; max-width: 350px; display: flex; flex-wrap: wrap; gap: 0.5rem;">
      <button data-category="All" class="brand-btn active">All</button>
      <button data-category="Plushies" class="brand-btn">Plushies</button>
      <button data-category="Wooden Toys" class="brand-btn">Wooden Toys</button>
      <button data-category="Vehicles" class="brand-btn">Vehicles</button>
      <button data-category="Building Sets" class="brand-btn">Building Sets</button>
      <button data-category="Action Figures" class="brand-btn">Action Figures</button>
      <button data-category="Games & Puzzles" class="brand-btn">Games</button>
      <button data-category="Dolls" class="brand-btn">Dolls</button>
    </div>

    <input type="search" id="catalog-search" placeholder="Search products..." aria-label="Search products" style="flex-grow: 2; max-width: 300px; padding: 0.5rem; border-radius: 12px; border: 1px solid #ddd;" />

    <select id="price-sort" aria-label="Sort by price" style="padding: 0.5rem; border-radius: 12px; border: 1px solid #ddd;">
      <option value="default">Sort By Price</option>
      <option value="price-asc">Low to High</option>
      <option value="price-desc">High to Low</option>
    </select>
  </section>

  <section id="catalog-products" class="product-grid"></section>
</main>

<script src="script.js"></script>
