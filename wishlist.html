<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wishlist — ToyLand World</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html">ToyLand World</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart</a>
      </nav>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="icon-btn">🔍</button>
        <a class="icon-btn" href="wishlist.html">❤ <span class="badge wish-count">0</span></a>
        <a class="icon-btn" href="cart.html">🛒 <span class="badge cart-count">0</span></a>
        <button class="mobile-toggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <main class="container">
    <h1>Your Wishlist</h1>
    <section id="wishListGrid" class="shop-grid">
      <!-- wishlist items rendered here -->
    </section>
  </main>

  <footer class="footer container">© ToyLand World</footer>

  <script src="app.js"></script>
  <script>
    function renderWishlist(){
      const grid = document.getElementById('wishListGrid');
      const w = loadWishlist();
      grid.innerHTML = '';
      if(!w.length){ grid.innerHTML = '<p>Your wishlist is empty. Browse the shop to add favorites.</p>'; return; }
      w.forEach(id=>{ const p = getProductById(id); if(!p) return; const card = document.createElement('div'); card.className='product-card'; card.innerHTML = `<img src="${p.img}" alt="${p.title}"><h3>${p.title}</h3><div class='meta'>$${p.price.toFixed(2)} · <span class='rating'>${'★'.repeat(Math.round(p.rating))}</span></div><div style='display:flex;gap:8px;align-items:center;margin-top:8px'><button class='btn add-cart' data-id='${p.id}'>Add to Cart</button><button class='btn remove-wish' data-id='${p.id}'>Remove</button></div>`; grid.appendChild(card); });
      grid.addEventListener('click',e=>{ const id = Number(e.target.dataset.id); if(!id) return; if(e.target.classList.contains('add-cart')){ addToCart(id,1); alert('Added to cart'); } if(e.target.classList.contains('remove-wish')){ toggleWishlist(id); renderWishlist(); } });
    }
    document.addEventListener('DOMContentLoaded',()=>{ renderWishlist(); updateBadges(); });
  </script>
</body>
</html>
