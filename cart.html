<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GamingGear — Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">GamingGear</a>
      <nav class="site-nav" id="siteNav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button id="navToggle" class="nav-toggle" aria-label="Toggle menu">☰</button>
        <a href="wishlist.html" class="icon-btn" aria-label="Wishlist">♥ <span class="badge" id="wishCount">0</span></a>
        <a href="cart.html" class="icon-btn" aria-label="Cart">🛒 <span class="badge" id="cartCount">0</span></a>
      </div>
    </div>
  </header>

  <main>
    <div class="container">
      <h1>Your Cart</h1>
      <div class="cart-wrap">
        <table class="cart-table">
          <thead>
            <tr><th>Product</th><th>Price</th><th>Qty</th><th>Line</th></tr>
          </thead>
          <tbody id="cartTableBody">
            <!-- rows rendered by app.js -->
          </tbody>
        </table>

        <aside class="cart-totals">
          <div class="totals-row">Subtotal: <span id="subtotal">$0.00</span></div>
          <div class="totals-row">Tax (7%): <span id="tax">$0.00</span></div>
          <div class="totals-row total">Total: <span id="total">$0.00</span></div>

          <h2>Checkout</h2>
          <form id="checkoutForm" class="checkout-form">
            <label for="chkName">Name
              <input id="chkName" type="text" required>
            </label>

            <label for="chkEmail">Email
              <input id="chkEmail" type="email" required>
            </label>

            <label for="chkAddress">Address
              <input id="chkAddress" type="text" required>
            </label>

            <button type="submit" class="btn btn-place-order">Place Order</button>
            <div id="checkoutMsg" class="form-msg"></div>
          </form>
        </aside>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© GamingGear — Neon Performance</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
