<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cart — ToyLand World</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">ToyLand World</div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart <span class="badge cart-count">0</span></a>
      </nav>
    </header>

    <main>
      <h1>Your Cart</h1>
      <div style="display:grid;grid-template-columns:2fr 1fr;gap:18px">
        <div>
          <table class="cart-table">
            <thead><tr><th>Product</th><th>Title</th><th>Price</th><th>Qty</th><th>Total</th><th></th></tr></thead>
            <tbody id="cartBody"></tbody>
          </table>
        </div>
        <aside>
          <div class="order-summary">
            <h3>Order Summary</h3>
            <div style="display:flex;justify-content:space-between"><div>Subtotal</div><div id="subtotal">$0.00</div></div>
            <div style="display:flex;justify-content:space-between"><div>Tax</div><div id="tax">$0.00</div></div>
            <div style="display:flex;justify-content:space-between"><div>Shipping</div><div id="shipping">$0.00</div></div>
            <div style="display:flex;justify-content:space-between;font-weight:700"><div>Total</div><div id="orderTotal">$0.00</div></div>
            <hr>
            <form id="checkoutForm" class="checkout-form">
              <input class="input" name="name" placeholder="Full name" required>
              <input class="input" name="email" placeholder="Email" type="email" required>
              <input class="input" name="address" placeholder="Shipping address" required>
              <select class="input" name="payment">
                <option>Credit Card</option>
                <option>PayPal</option>
                <option>Cash on Delivery</option>
              </select>
              <button class="btn" type="submit">Place Order</button>
            </form>
          </div>
        </aside>
      </div>
    </main>

    <footer class="footer">© ToyLand World</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
