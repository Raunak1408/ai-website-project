<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cart — LittleLearners</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="logo"><a href="index.html">LittleLearners</a></div>
      <nav id="main-navigation" class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="activities.html">Activities</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html" class="active cart-link">Cart <span class="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Your Cart</h2>
    <div id="cart-items"></div>

    <aside class="cart-summary">
      <div>Subtotal: <span id="subtotal">$0.00</span></div>
      <div>Shipping: <span id="shipping">$0.00</span></div>
      <div><strong>Grand Total: <span id="total">$0.00</span></strong></div>
      <div class="cart-actions">
        <button id="checkout" class="btn btn-primary">Proceed to Checkout</button>
        <a href="shop.html" class="btn btn-outline">Continue Shopping</a>
      </div>
    </aside>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="about">LittleLearners — premium educational toys for curious kids.</div>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
