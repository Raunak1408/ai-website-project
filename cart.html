<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WonderToys - Cart & Checkout</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="app.js"></script>
</head>
<body>
<header class="header">
    <div class="container header-container">
        <div class="logo">WonderToys</div>
        <nav class="nav">
            <ul class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="cart.html">Cart <span class="cart-badge" id="cart-count">0</span></a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-search">
                <input type="search" id="search-product" placeholder="Search toys..." aria-label="Search toys" />
            </div>
            <button class="mobile-menu-toggle" aria-label="Toggle mobile menu">&#9776;</button>
        </nav>
    </div>
</header>

<main class="cart-checkout container">
    <section class="cart-items">
        <h2>Your Cart</h2>
        <ul class="cart-items-list">
            <!-- Cart items will be dynamically added here -->
        </ul>
    </section>

    <section class="order-summary">
        <h2>Order Summary</h2>
        <div class="order-summary-box">
            <p>Subtotal: <span id="subtotal">$0.00</span></p>
            <p>Shipping Cost: <span id="shipping-cost">$5.00</span></p>
            <p>Discount Code: <input type="text" id="discount-code" placeholder="Enter promo code" /></p>
            <p>Total: <span id="total-amount">$0.00</span></p>
        </div>

        <form class="checkout-form" aria-label="Checkout Form">
            <h3>Checkout</h3>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required />

            <label for="address">Shipping Address:</label>
            <textarea id="address" name="address" rows="3" required></textarea>

            <label for="payment-method">Payment Method:</label>
            <select id="payment-method" name="payment-method" required>
                <option value="credit-card">Credit Card</option>
                <option value="paypal">PayPal</option>
                <option value="bank-transfer">Bank Transfer</option>
            </select>

            <button type="submit" class="btn-primary">Place Order</button>
        </form>
    </section>
</main>

<footer class="footer">
    <div class="container footer-container">
        <div class="footer-left">
            <h3>WonderToys</h3>
            <p>Bringing joy to playtime!</p>
        </div>
        <div class="footer-right">
            <div class="social-links">
                <a href="#" aria-label="Facebook"><img src="https://img.icons8.com/color/48/000000/facebook-new.png" alt="Facebook" /></a>
                <a href="#" aria-label="Twitter"><img src="https://img.icons8.com/color/48/000000/twitter.png" alt="Twitter" /></a>
                <a href="#" aria-label="Instagram"><img src="https://img.icons8.com/color/48/000000/instagram-new.png" alt="Instagram" /></a>
            </div>
            <form class="newsletter-form" aria-label="Subscribe to newsletter">
                <input type="email" placeholder="Your email address" aria-label="Your email address" required />
                <button type="submit">Subscribe</button>
            </form>
        </div>
    </div>
</footer>

</body>
</html>
