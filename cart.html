<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GamerGear — Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">GamerGear</a>
      <nav class="site-nav" id="siteNav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <button id="navToggle" class="nav-toggle" aria-label="Toggle menu">☰</button>
        <a href="#" class="icon-btn">🔍</a>
        <a href="wishlist.html" class="icon-btn" id="wishlistBtn">♡ <span id="wishCount" class="badge">0</span></a>
        <a href="cart.html" class="icon-btn">🛒 <span id="cartCount" class="badge">0</span></a>
      </div>
    </div>
  </header>

  <main class="container cart-page">
    <h1>Your Cart</h1>
    <div id="cartContainer">
      <!-- cart table injected by app.js -->
    </div>

    <section class="checkout">
      <h2>Checkout</h2>
      <form id="checkoutForm">
        <div class="form-row">
          <label>Name <input id="chkName" type="text" required></label>
        </div>
        <div class="form-row">
          <label>Email <input id="chkEmail" type="email" required></label>
        </div>
        <div class="form-row">
          <label>Address <input id="chkAddress" type="text" required></label>
        </div>
        <div class="form-row">
          <label>Card Number <input id="chkCard" type="text" minlength="12" required></label>
        </div>
        <div class="form-row">
          <button class="btn btn-primary" type="submit">Place Order</button>
        </div>
        <div id="checkoutMsg" class="form-message"></div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; GamerGear — Neon Performance. All rights reserved.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
