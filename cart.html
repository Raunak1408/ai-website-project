<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cart - ToyLand World</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo"><img src="https://images.unsplash.com/photo-1566576912321-d58ddd7a6088?w=1200" alt="logo"><h1>ToyLand World</h1></div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart</a>
        <button class="icon-btn"><span>♡</span><span class="wish-count">0</span></button>
        <button class="icon-btn"><span>🛒</span><span class="cart-count">0</span></button>
      </nav>
      <button id="mobile-toggle" class="mobile-toggle">☰</button>
    </div>
  </header>

  <main class="container">
    <h2>Your Cart</h2>
    <div style="display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start">
      <div>
        <table class="table" id="cart-table"></table>
      </div>
      <aside class="summary">
        <h4>Order Summary</h4>
        <div>Subtotal: <strong id="subtotal">$0.00</strong></div>
        <div>Tax: <strong id="tax">$0.00</strong></div>
        <div>Shipping: <strong id="shipping">$0.00</strong></div>
        <div style="margin-top:12px">Total: <strong id="total">$0.00</strong></div>
        <div style="margin-top:12px">
          <form id="checkout-form">
            <div class="form-row"><input name="name" placeholder="Full name"></div>
            <div class="form-row"><input name="email" placeholder="Email"></div>
            <div class="form-row"><input name="address" placeholder="Shipping address"></div>
            <div class="form-row"><select name="payment"><option>Credit Card</option><option>PayPal</option><option>Cash on Delivery</option></select></div>
            <button class="place" type="submit">Place Order</button>
          </form>
        </div>
      </aside>
    </div>
  </main>

  <footer class="footer">&copy; 2026 ToyLand World</footer>
  <script src="script.js"></script>
  <script>renderCart();attachCheckout();</script>
</body>
</html>
