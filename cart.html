<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cart — ToyNest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container" style="max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:14px 16px;">
      <div class="logo">ToyNest</div>
      <button class="nav-toggle" aria-controls="main-navigation" aria-expanded="false" aria-label="Open menu"><span class="hamburger"></span></button>
      <nav id="main-navigation" class="nav main-nav" aria-hidden="false">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html" class="cart-link">Cart <span class="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Your Cart</h2>
    <div id="cart-items" class="cart-items"></div>

    <aside id="cart-summary" class="cart-summary">
      <div id="subtotal">Subtotal: $0</div>
      <div id="shipping">Shipping: $0</div>
      <div id="total">Total: $0</div>
      <div class="cart-actions">
        <a href="products.html" class="btn">Continue Shopping</a>
        <button id="checkout" class="btn btn-primary">Proceed to Checkout</button>
      </div>
      <div id="cart-feedback" role="status" aria-live="polite"></div>
    </aside>
  </main>

  <footer class="site-footer">
    <div class="container">ToyNest — Premium toys for curious kids.</div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
