<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cart — ToyLand World</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container inner">
      <div class="logo">ToyLand World</div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html" class="icon-btn">Cart <span class="badge cart-count">0</span></a>
        <button class="icon-btn">Wishlist <span class="badge wish-count">0</span></button>
      </nav>
      <button id="mobileToggle" class="mobile-toggle icon-btn">Menu</button>
    </div>
  </header>

  <main class="container">
    <h1>Your Cart</h1>
    <div style="display:flex;gap:20px;flex-wrap:wrap">
      <div style="flex:1;min-width:320px">
        <table class="cart-table">
          <thead><tr><th>Item</th><th>Title</th><th>Price</th><th>Qty</th><th>Total</th><th>Action</th></tr></thead>
          <tbody id="cartBody"></tbody>
        </table>
      </div>
      <div style="width:320px">
        <div class="summary">
          <h3>Order Summary</h3>
          <div>Subtotal: <span id="subTotal">$0.00</span></div>
          <div>Tax (7%): <span id="taxAmt">$0.00</span></div>
          <div>Shipping: <span id="shipAmt">$0.00</span></div>
          <hr>
          <div style="font-weight:700">Total: <span id="totalAmt">$0.00</span></div>
        </div>

        <form id="checkoutForm" class="summary" style="margin-top:12px">
          <h4>Checkout</h4>
          <div class="form-field"><label>Name</label><input id="cName"></div>
          <div class="form-field"><label>Address</label><textarea id="cAddress"></textarea></div>
          <div class="form-field"><label>Payment</label><select id="cPay"><option>Credit Card</option><option>PayPal</option></select></div>
          <button type="submit" class="button-primary">Place Order</button>
        </form>
      </div>
    </div>

    <footer class="footer">ToyLand World</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
