<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ToyLand Magic - Cart & Checkout</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body style="background-color: #fffdfa; font-family: 'Playfair Display', serif; color:#333;">

<header class="header">
  <nav class="navbar">
    <div class="logo" style="font-weight: 700; font-size: 1.8rem; cursor:pointer;">ToyLand Magic </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="catalog.html">Shop</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <input type="search" id="navbar-search" placeholder="Search toys..." aria-label="Search toys" />
    <div class="cart-icon">
      <a href="cart.html" title="Your Cart">
        <img src="https://images.unsplash.com/photo-1559454403-b8fb88521f11?auto=format&fit=crop&w=40&q=80" alt="Cart Icon" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1559454403-b8fb88521f11?auto=format&fit=crop&w=40&q=80';" />
        <span id="cart-badge" class="badge"></span>
      </a>
    </div>
  </nav>
</header>

<main style="margin: 2rem; max-width: 900px;">
  <h1 style="color:#3b82f6;">Shopping Cart</h1>
  <section id="cart-items" style="margin-bottom: 1rem;"></section>

  <section id="cart-summary" style="background: #fff; border-radius: 16px; padding: 1rem; box-shadow: 0 0 15px rgba(59, 130, 246, 0.2);">
    <p>Subtotal: $<span id="subtotal">0.00</span></p>
    <p>Tax (8%): $<span id="tax">0.00</span></p>
    <p>Shipping: $<span id="shipping">5.00</span></p>
    <hr />
    <p><strong>Total: $<span id="total">0.00</span></strong></p>
    <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
      <input type="text" id="promo-code" placeholder="Promo Code" style="padding: 0.5rem; border-radius: 12px; border: 1px solid #ddd; flex-grow: 1;" />
      <button id="apply-promo" style="background-color: #ff5757; color: white; border-radius: 16px; border: none; padding: 0.5rem 1rem; font-weight: 700; cursor: pointer;">Apply</button>
    </div>
    <button id="checkout-btn" style="margin-top: 1rem; width: 100%; background-color: #3b82f6; color: white; border-radius: 16px; border: none; padding: 1rem; font-weight: 700; cursor: pointer;">Checkout</button>
  </section>

  <div id="checkout-modal" style="display:none; position: fixed; top:0; left:0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
    <form id="checkout-form" style="background: #fff; border-radius: 16px; padding: 2rem; max-width: 400px; width: 95%;">
      <h2 style="margin-top:0; color:#3b82f6;">Checkout</h2>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" required style="width:100%; margin-bottom:1rem; padding:0.5rem; border-radius:12px; border:1px solid #ddd;" />
      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required style="width:100%; margin-bottom:1rem; padding:0.5rem; border-radius:12px; border:1px solid #ddd;" />
      <button type="submit" style="background-color:#ff5757; color:#fff; width:100%; padding: 0.75rem; border:none; border-radius: 16px; font-weight: 700;">Place Order</button>
      <button type="button" id="close-checkout" style="margin-top:1rem; width:100%; padding:0.5rem; border:none; background:#ddd; border-radius:12px;">Cancel</button>
    </form>
  </div>
</main>

<script src="script.js"></script>
<script>
  const productsCatalog = [
    {id: 'prod1', name: "Cuddle Buddy Teddy Bear", price: 19.99, category: "Plushies", age: "0-3 yrs", image: "https://images.unsplash.com/photo-1559454403-b8fb88521f11?auto=format&fit=crop&w=600&q=80"},
    {id: 'prod2', name: "Rainbow Wooden Stacker", price: 24.99, category: "Wooden Toys", age: "1-4 yrs", image: "https://images.unsplash.com/photo-1587654780291-39c9404d746b?auto=format&fit=crop&w=600&q=80"},
    {id: 'prod3', name: "Super Turbo Race Car", price: 14.99, category: "Vehicles", age: "3+ yrs", image: "https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?auto=format&fit=crop&w=600&q=80"},
    {id: 'prod4', name: "Galaxy Explorer LEGO Set", price: 49.99, category: "Building Sets", age: "6+ yrs", image: "https://images.unsplash.com/photo-1585366119957-e9730b6d0f60?auto=format&fit=crop&w=600&q=80"},
    {id: 'prod5', name: "Cyber Bot Action Figure", price: 29.99, category: "Action Figures", age: "5+ yrs", image: "https://images.unsplash.com/photo-1566576721346-d4a3b4eaeb55?auto=format&fit=crop&w=600&q=80"},
    {id: 'prod6', name: "Magic Family Board Game", price: 34.99, category: "Games & Puzzles", age: "8+ yrs", image: "https://images.unsplash.com/photo-1610890716171-6b1bb98ffd09?auto=format&fit=crop&w=600&q=80"},
    {id: 'prod7', name: "Vintage Princess Doll", price: 22.99, category: "Dolls", age: "3+ yrs", image: "https://images.unsplash.com/photo-1535572290543-960a8046f5af?auto=format&fit=crop&w=600&q=80"},
    {id: 'prod8', name: "Classic Wooden Rocking Horse", price: 59.99, category: "Wooden Toys", age: "2-5 yrs", image: "https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?auto=format&fit=crop&w=600&q=80"}
  ];

  const cartKey = 'toylandmagic-cart';

  function getCart() {
    let cart = localStorage.getItem(cartKey);
    return cart ? JSON.parse(cart) : [];
  }

  function saveCart(cart) {
    localStorage.setItem(cartKey, JSON.stringify(cart));
    updateCartBadge();
  }

  function updateCartBadge() {
    const badge = document.getElementById('cart-badge');
    if (!badge) return;
    const cart = getCart();
    const count = cart.reduce((sum, item) => sum + item.quantity, 0);
    badge.textContent = count > 0 ? count : '';
  }

  function renderCart() {
    const container = document.getElementById('cart-items');
    container.innerHTML = '';
    const cart = getCart();
    if (cart.length === 0) {
      container.innerHTML = '<p>Your cart is empty.</p>';
      return;
    }

    let subtotal = 0;

    cart.forEach(({id, quantity}) => {
      const product = productsCatalog.find(p => p.id === id);
      if (!product) return;
      subtotal += product.price * quantity;

      const div = document.createElement('div');
      div.className = 'cart-item';
      div.style.display = 'flex';
      div.style.justifyContent = 'space-between';
      div.style.alignItems = 'center';
      div.style.marginBottom = '1rem';
      div.style.background = '#fff';
      div.style.padding = '1rem';
      div.style.borderRadius = '12px';
      div.style.boxShadow = '0 0 15px rgba(59, 130, 246, 0.2)';

      div.innerHTML = `
        <div style="display:flex; align-items:center; gap: 1rem;">
          <img src="${product.image}" alt="${product.name}" width="80" style="border-radius: 12px;" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1559454403-b8fb88521f11?auto=format&fit=crop&w=600&q=80';" />
          <div>
            <h3>${product.name}</h3>
            <p>${product.category} | Age: ${product.age}</p>
          </div>
        </div>
        <div>
          <button class="qty-btn" data-id="${product.id}" data-action="decrease" style="margin-right: 0.5rem;">-</button>
          <span>${quantity}</span>
          <button class="qty-btn" data-id="${product.id}" data-action="increase" style="margin-left: 0.5rem;">+</button>
        </div>
        <div style="font-weight: 700; color: #3b82f6;">$${(product.price * quantity).toFixed(2)}</div>
        <div><button class="remove-item" data-id="${product.id}" style="color: #ff5757; cursor:pointer; border:none; background:none;">Remove</button></div>
      `;

      container.appendChild(div);
    });

    // Set summary
    document.getElementById('subtotal').textContent = subtotal.toFixed(2);
    const tax = subtotal * 0.08;
    document.getElementById('tax').textContent = tax.toFixed(2);
    const shipping = subtotal > 0 ? 5.00 : 0;
    document.getElementById('shipping').textContent = shipping.toFixed(2);
    const total = subtotal + tax + shipping;
    document.getElementById('total').textContent = total.toFixed(2);
  }

  function changeQuantity(id, action) {
    let cart = getCart();
    const idx = cart.findIndex(i => i.id === id);
    if (idx === -1) return;
    if (action === 'increase') {
      cart[idx].quantity++;
    } else if (action === 'decrease') {
      if (cart[idx].quantity > 1) {
        cart[idx].quantity--;
      } else {
        if (confirm('Remove item from cart?')) {
          cart.splice(idx, 1);
        }
      }
    }
    saveCart(cart);
    renderCart();
  }

  function removeItem(id) {
    let cart = getCart();
    cart = cart.filter(i => i.id !== id);
    saveCart(cart);
    renderCart();
  }

  function applyPromoCode() {
    const promoInput = document.getElementById('promo-code');
    const promoCode = promoInput.value.trim().toUpperCase();
    if (promoCode === 'TOYLAND10') {
      alert('Promo code applied! You get 10% off on your total.');
      // In a real app, apply discount. Here just alert.
    } else if (promoCode.length > 0) {
      alert('Invalid promo code.');
    }
    promoInput.value = '';
  }

  function showCheckoutModal(show) {
    const modal = document.getElementById('checkout-modal');
    modal.style.display = show ? 'flex' : 'none';
  }

  function handleCheckoutFormSubmit(e) {
    e.preventDefault();
    alert('Thank you for your order! We will process it soon.');
    localStorage.removeItem(cartKey);
    updateCartBadge();
    renderCart();
    showCheckoutModal(false);
  }

  document.addEventListener('DOMContentLoaded', () => {
    updateCartBadge();
    renderCart();

    document.getElementById('cart-items').addEventListener('click', e => {
      if (e.target.classList.contains('qty-btn')) {
        const id = e.target.dataset.id;
        const action = e.target.dataset.action;
        changeQuantity(id, action);
      } else if (e.target.classList.contains('remove-item')) {
        const id = e.target.dataset.id;
        if (confirm('Are you sure you want to remove this item?')) {
          removeItem(id);
        }
      }
    });

    document.getElementById('apply-promo').addEventListener('click', applyPromoCode);

    document.getElementById('checkout-btn').addEventListener('click', () => showCheckoutModal(true));

    document.getElementById('close-checkout').addEventListener('click', () => showCheckoutModal(false));

    document.getElementById('checkout-form').addEventListener('submit', handleCheckoutFormSubmit);
  });
</script>

</body>
</html>
