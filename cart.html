<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cart — ToyNest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="hero-grid container">
      <div class="logo">ToyNest</div>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html" class="active">Cart <span class="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Your Cart</h2>
    <div id="cart-items" class="cart-items"></div>

    <aside id="cart-summary" class="cart-summary">
      <div id="subtotal">Subtotal: $0</div>
      <div id="shipping">Shipping: $0</div>
      <div id="total">Total: $0</div>
      <div class="cart-actions">
        <a class="btn" href="products.html">Continue Shopping</a>
        <button id="checkout" class="btn btn-primary">Proceed to Checkout</button>
      </div>
    </aside>
  </main>

  <footer class="site-footer container">
    <div>ToyNest — Premium toys for curious kids</div>
    <nav>
      <a href="products.html">Products</a> ·
      <a href="about.html">About</a> ·
      <a href="contact.html">Contact</a>
    </nav>
    <div>© ToyNest</div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
