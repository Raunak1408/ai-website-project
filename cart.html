<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WonderToys - Cart & Checkout</title>
<link rel="stylesheet" href="style.css" />
<script defer src="app.js"></script>
</head>
<body>
<header class="header">
  <div class="container header-container">
    <div class="logo">WonderToys</div>
    <nav class="nav">
      <ul class="nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="cart.html" class="active">Cart <span class="cart-badge" id="cart-count">0</span></a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
      <div class="nav-search">
        <input type="search" id="search-cart" placeholder="Search toys..." aria-label="Search toys" />
      </div>
      <button class="mobile-menu-toggle" aria-label="Toggle navigation">
        &#9776;
      </button>
    </nav>
  </div>
</header>

<main class="cart-checkout container">
  <section class="cart-items">
    <h2>Your Shopping Cart</h2>
    <table class="cart-table">
      <thead>
        <tr>
          <th>Item</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Remove</th>
        </tr>
      </thead>
      <tbody id="cart-items-list">
        <!-- Cart items inserted here dynamically -->
      </tbody>
    </table>
  </section>

  <section class="order-summary">
    <h2>Order Summary</h2>
    <div class="summary-details">
      <p>Subtotal: $<span id="subtotal">0.00</span></p>
      <p>Shipping: $<span id="shipping">5.00</span></p>
      <label for="promo-code">Promo Code:</label>
      <input type="text" id="promo-code" placeholder="Enter code" />
      <button id="apply-promo" class="btn-secondary">Apply</button>
      <p class="total-amount">Total: $<span id="total">0.00</span></p>
    </div>

    <form class="checkout-form" id="checkout-form">
      <h3>Checkout</h3>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required />
      <label for="address">Shipping Address</label>
      <textarea id="address" name="address" required></textarea>
      <label for="payment-method">Payment Method</label>
      <select id="payment-method" name="payment-method" required>
        <option value="credit-card">Credit Card</option>
        <option value="paypal">PayPal</option>
        <option value="apple-pay">Apple Pay</option>
      </select>
      <button type="submit" class="btn-primary">Place Order</button>
    </form>
  </section>
</main>

<footer class="footer">
  <div class="container footer-container">
    <div class="footer-left">
      <h3>WonderToys</h3>
      <p>Bringing joy to playtime!</p>
    </div>
    <div class="footer-right">
      <div class="social-links">
        <a href="#" aria-label="Facebook"><img src="https://img.icons8.com/color/48/000000/facebook-new.png" alt="Facebook" /></a>
        <a href="#" aria-label="Twitter"><img src="https://img.icons8.com/color/48/000000/twitter.png" alt="Twitter" /></a>
        <a href="#" aria-label="Instagram"><img src="https://img.icons8.com/color/48/000000/instagram-new.png" alt="Instagram" /></a>
      </div>
      <form class="newsletter-form" aria-label="Subscribe to newsletter">
        <input type="email" placeholder="Your email address" aria-label="Email address" required />
        <button type="submit">Subscribe</button>
      </form>
    </div>
  </div>
</footer>

</body>
</html>
