<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToyJoy Land - Shop</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
<header class="header-banner">
    <nav class="navbar">
        <div class="logo">ToyJoy Land</div>
        <ul class="nav-links" id="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="shop.html">Shop</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><button id="cart-button">Cart (<span id="cart-count">0</span>)</button></li>
            <li class="nav-toggle"><button id="nav-toggle-btn" aria-label="Toggle navigation">&#9776;</button></li>
        </ul>
    </nav>
</header>

<main>
    <section class="shop-main">
        <h1>Shop All Toys</h1>
        <div class="filter-bar">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="action-figures">Action Figures</button>
            <button class="filter-btn" data-category="educational">Educational</button>
            <button class="filter-btn" data-category="plush-toys">Plush Toys</button>
            <button class="filter-btn" data-category="board-games">Board Games</button>
        </div>
        <div class="products-grid" id="products-grid">
            <!-- Products loaded dynamically by JS -->
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2024 ToyJoy Land. All rights reserved.</p>
</footer>
</body>
</html>
