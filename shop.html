<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ToyLand World - Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-shop">
  <header class="header">
    <div class="container">
      <div class="logo"><img src="https://images.unsplash.com/photo-1566576912321-d58ddd7a6088?w=1200" alt="logo"><h1>ToyLand World</h1></div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart</a>
        <button class="icon-btn"><span>♡</span><span class="wish-count">0</span></button>
        <button class="icon-btn"><span>🛒</span><span class="cart-count">0</span></button>
      </nav>
      <button id="mobile-toggle" class="mobile-toggle">☰</button>
    </div>
  </header>

  <main class="container">
    <h2>All Toys</h2>
    <div class="controls">
      <div class="search"><input id="search" type="search" placeholder="Search toys by title"></div>
      <div class="filter">
        <button data-filter-cat="All">All</button>
        <button data-filter-cat="Action Figures">Action Figures</button>
        <button data-filter-cat="Educational">Educational</button>
        <button data-filter-cat="Board Games">Board Games</button>
        <button data-filter-cat="Plush">Plush</button>
      </div>
      <select id="sort"><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option></select>
    </div>

    <div class="products-grid"></div>
  </main>

  <footer class="footer">&copy; 2026 ToyLand World</footer>
  <script src="script.js"></script>
  <script>
    // Prepare product list
    window.PRODUCTS = window.PRODUCTS || [];
    renderShop(PRODUCTS);
    attachShopFilters();
  </script>
</body>
</html>
