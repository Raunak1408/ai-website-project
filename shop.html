<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ToyLand World — Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html">ToyLand World</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart</a>
      </nav>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="icon-btn">🔍</button>
        <a class="icon-btn" href="wishlist.html">❤ <span class="badge wish-count">0</span></a>
        <a class="icon-btn" href="cart.html">🛒 <span class="badge cart-count">0</span></a>
        <button class="mobile-toggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="card-row">
      <div class="controls">
        <input id="searchInput" class="input" placeholder="Search products...">
        <select id="categoryFilter" class="input">
          <option>All</option>
          <option>Action Figures</option>
          <option>Educational</option>
          <option>Board Games</option>
          <option>Plush</option>
        </select>
        <select id="sortFilter" class="input">
          <option value="">Default</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>
      </div>
    </div>

    <section class="shop-grid" id="shopGrid">
      <!-- product cards injected -->
    </section>

  </main>

  <footer class="footer container">
    <div>© ToyLand World — Premium Toy Store</div>
  </footer>

  <script src="app.js"></script>
  <script>
    // initialize shop page functions
    document.addEventListener('DOMContentLoaded',()=>{if(typeof initShopPage==='function') initShopPage();});
  </script>
</body>
</html>
