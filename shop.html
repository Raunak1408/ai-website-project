<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TOYLAND Shop - Wonder & Play Emporium</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka&family=Poppins&display=swap" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #fff9e6;
      color: #1e293b;
    }
    h1,h2,h3,h4,h5 {
      font-family: 'Fredoka', cursive;
    }
  </style>
</head>
<body class="relative">
  <!-- Navbar -->
  <header class="bg-yellow-400 shadow-md fixed w-full z-30">
    <div class="container mx-auto px-4 flex justify-between items-center h-16">
      <a href="index.html" class="text-3xl font-fredoka font-bold text-navy-900 hover:text-coral-red transition">TOYLAND</a>
      <nav class="space-x-6 text-lg font-semibold">
        <a href="index.html" class="hover:text-coral-red transition">Home</a>
        <a href="shop.html" class="hover:text-coral-red transition font-bold underline">Shop</a>
        <a href="about.html" class="hover:text-coral-red transition">About</a>
        <a href="contact.html" class="hover:text-coral-red transition">Contact</a>
      </nav>
      <div class="flex items-center space-x-4">
        <button id="wishlistBtn" aria-label="Wishlist" class="relative text-sky-600 hover:text-sky-800 focus:outline-none">
          <i class="fas fa-heart fa-lg"></i>
          <span id="wishlistCount" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full text-xs w-5 h-5 flex items-center justify-center">0</span>
        </button>
        <button id="cartBtn" aria-label="Cart" class="relative text-navy-900 hover:text-navy-700 focus:outline-none">
          <i class="fas fa-shopping-cart fa-lg"></i>
          <span id="cartCount" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full text-xs w-5 h-5 flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="pt-20 container mx-auto px-4">
    <h1 class="text-4xl font-fredoka font-bold text-navy mb-6 text-center">Shop Our Toys</h1>
    
    <!-- Filters and Search -->
    <section aria-label="Product filters and search" class="mb-8 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
      <input type="text" id="searchInput" placeholder="Search toys..." aria-label="Search toys" class="p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring focus:ring-yellow-300 flex-grow md:flex-grow-0 w-full md:w-1/3" />
      <select id="categoryFilter" aria-label="Filter by Category" class="p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring focus:ring-yellow-300 w-full md:w-1/4">
        <option value="all">All Categories</option>
        <option value="plushies">Plush Toys</option>
        <option value="vehicles">Vehicles & Rides</option>
        <option value="puzzles">Puzzles & Games</option>
      </select>
      <select id="priceSort" aria-label="Sort by Price" class="p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring focus:ring-yellow-300 w-full md:w-1/4">
        <option value="default">Sort by Price</option>
        <option value="asc">Price: Low to High</option>
        <option value="desc">Price: High to Low</option>
      </select>
    </section>

    <!-- Product Catalog Grid -->
    <section aria-label="Product Catalog" id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <!-- Dynamic products go here -->
    </section>
  </main>

  <!-- Shared UI Components from index.html -->
  <div id="cartDrawer" class="fixed top-0 right-0 h-full w-80 bg-white shadow-lg transform translate-x-full transition-transform overflow-y-auto z-40">
    <div class="p-4 border-b border-gray-300 flex justify-between items-center">
      <h3 class="text-xl font-fredoka font-bold">Your Cart</h3>
      <button id="closeCartBtn" aria-label="Close Cart" class="text-gray-600 hover:text-gray-900 focus:outline-none"><i class="fas fa-times fa-lg"></i></button>
    </div>
    <div id="cartItems" class="p-4 space-y-4">
      <!-- Cart items dynamically added here -->
    </div>
    <div class="p-4 border-t border-gray-300">
      <div class="flex justify-between items-center font-semibold text-lg">
        <span>Total:</span>
        <span id="cartTotal">$0.00</span>
      </div>
      <button id="checkoutBtn" class="w-full mt-4 bg-coral-red text-white py-2 rounded hover:bg-coral-red-dark transition">Checkout</button>
    </div>
  </div>

  <div id="wishlistDrawer" class="fixed top-0 right-0 h-full w-80 bg-white shadow-lg transform translate-x-full transition-transform overflow-y-auto z-40">
    <div class="p-4 border-b border-gray-300 flex justify-between items-center">
      <h3 class="text-xl font-fredoka font-bold">Your Wishlist</h3>
      <button id="closeWishlistBtn" aria-label="Close Wishlist" class="text-gray-600 hover:text-gray-900 focus:outline-none"><i class="fas fa-times fa-lg"></i></button>
    </div>
    <div id="wishlistItems" class="p-4 space-y-4">
      <!-- Wishlist items dynamically added here -->
    </div>
  </div>

  <div id="quickViewModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50">
    <div class="bg-white rounded-lg shadow-lg max-w-lg w-full p-6 relative">
      <button id="closeQuickViewBtn" aria-label="Close Quick View" class="absolute top-3 right-3 text-gray-600 hover:text-gray-900 focus:outline-none">
        <i class="fas fa-times fa-lg"></i>
      </button>
      <div id="quickViewContent">
        <!-- Dynamic product details go here -->
      </div>
    </div>
  </div>

  <script>
    // Sample product data to display - 12 items minimum
    const products = [
      {id: 1, name: 'Teddy Bear Plush', category: 'plushies', price: 19.99, img: 'https://images.unsplash.com/photo-1581056778254-d8d6b9713933?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80', description: 'Soft and cuddly teddy bear plush toy for all ages.'},
      {id: 2, name: 'Wooden Toy Car', category: 'vehicles', price: 24.99, img: 'https://images.unsplash.com/photo-1520342868574-5fa3804e551c?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80', description: 'Classic wooden toy car with smooth wheels.'},
      {id: 3, name: 'Colorful Puzzle Set', category: 'puzzles', price: 29.99, img: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80', description: 'Challenging and colorful puzzle set for all ages.'},
      {id: 4, name: 'Remote Control Helicopter', category: 'vehicles', price: 49.99, img: 'https://images.unsplash.com/photo-1577688747139-fd3dc23e3830?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80', description: 'Fun remote control helicopter for outdoor play.'},
      {id: 5, name: 'Educational Blocks Set', category: 'puzzles', price: 19.99, img: 'https://images.unsplash.com/photo-1581115805761-b1d3db8e87ce?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80', description: 'Blocks designed to encourage creativity and learning.'},
      {id: 6, name: 'Kids Ride-on Car', category: 'vehicles', price: 99.99, img: 'https://images.unsplash.com/photo-1575917981784-39b0a5f84720?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80', description: 'Safe and fun kids ride-on car with remote.'},
      {id: 7, name: 'Stuffed Bunny Plush', category: 'plushies', price: 14.99, img: 'https://images.unsplash.com/photo-1525253086316-d0c936c814f8?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80', description: 'Soft bunny plush toy for cuddles and playtime.'},
      {id: 8, name: 'Miniature Train Set', category: 'puzzles', price: 39.99, img: 'https://images.unsplash.com/photo-1527694224678-64121c250681?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80', description: 'Miniature train set with tracks for imaginative play.'},
      {id: 9, name: 'Electric Scooter', category: 'vehicles', price: 129.99, img: 'https://images.unsplash.com/photo-1556012018-0f425786d39a?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80', description: 'Electric scooter for kids with safety features.'},
      {id: 10, name: 'Puzzle Cube', category: 'puzzles', price: 9.99, img: 'https://images.unsplash.com/photo-1533622597524-1c0a6860a5d6?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80', description: 'Classic puzzle cube to challenge your mind.'},
      {id: 11, name: 'Fire Truck Toy', category: 'vehicles', price: 34.99, img: 'https://images.unsplash.com/photo-1532634726-a5b7a0c284b9?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80', description: 'Fire truck toy with sounds and lights.'},
      {id: 12, name: 'Dollhouse Playset', category: 'plushies', price: 59.99, img: 'https://images.unsplash.com/photo-1558036117-ccee9bdd65e6?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80', description: 'Beautiful dollhouse playset with furniture.'},
    ];

    const productGrid = document.getElementById('productGrid');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const priceSort = document.getElementById('priceSort');

    // Cart & Wishlist shared from index.html - triggering events are on those buttons with same IDs outside this script

    // Drawer toggling
    const cartBtn = document.getElementById('cartBtn');
    const cartDrawer = document.getElementById('cartDrawer');
    const closeCartBtn = document.getElementById('closeCartBtn');
    const wishlistBtn = document.getElementById('wishlistBtn');
    const wishlistDrawer = document.getElementById('wishlistDrawer');
    const closeWishlistBtn = document.getElementById('closeWishlistBtn');
    const quickViewModal = document.getElementById('quickViewModal');
    const closeQuickViewBtn = document.getElementById('closeQuickViewBtn');

    // Show/hide drawers
    cartBtn.addEventListener('click', () => cartDrawer.classList.remove('translate-x-full'));
    closeCartBtn.addEventListener('click', () => cartDrawer.classList.add('translate-x-full'));
    wishlistBtn.addEventListener('click', () => wishlistDrawer.classList.remove('translate-x-full'));
    closeWishlistBtn.addEventListener('click', () => wishlistDrawer.classList.add('translate-x-full'));
    closeQuickViewBtn.addEventListener('click', () => quickViewModal.classList.add('hidden'));

    function createProductCard(product) {
      const card = document.createElement('article');
      card.className = 'bg-white rounded-lg shadow-md p-4 flex flex-col';
      card.innerHTML = `
        <img src="${product.img}" alt="${product.name}" loading="lazy" onerror="this.onerror=null;this.src='https://via.placeholder.com/400x300?text=Image+Unavailable';" class="rounded-lg object-cover h-48 w-full mb-4" />
        <h3 class="font-bold text-lg text-navy">${product.name}</h3>
        <p class="text-coral-red font-semibold mt-1 mb-4">$${product.price.toFixed(2)}</p>
        <div class="mt-auto flex justify-between items-center gap-2">
          <button data-product-id="${product.id}" class="quick-view-btn bg-coral-red text-white rounded-md py-2 px-4 hover:bg-coral-red-dark transition">Quick View</button>
          <button data-product-id="${product.id}" class="add-to-cart-btn bg-yellow-400 text-navy rounded-md py-2 px-4 hover:bg-yellow-500 transition"><i class="fas fa-cart-plus"></i></button>
          <button data-product-id="${product.id}" class="wishlist-toggle-btn text-sky-600 hover:text-sky-800"><i class="fas fa-heart"></i></button>
        </div>
      `;
      return card;
    }

    function renderProducts(filteredProducts) {
      productGrid.innerHTML = '';
      filteredProducts.forEach(product => {
        productGrid.appendChild(createProductCard(product));
      });
      attachEventListeners();
    }

    function filterAndSort() {
      let filtered = products.filter(product => {
        let matchesSearch = product.name.toLowerCase().includes(searchInput.value.toLowerCase());
        let matchesCategory = (categoryFilter.value === 'all') || (product.category === categoryFilter.value);
        return matchesSearch && matchesCategory;
      });

      if (priceSort.value === 'asc') {
        filtered.sort((a,b) => a.price - b.price);
      } else if (priceSort.value === 'desc') {
        filtered.sort((a,b) => b.price - a.price);
      }

      renderProducts(filtered);
    }

    searchInput.addEventListener('input', filterAndSort);
    categoryFilter.addEventListener('change', filterAndSort);
    priceSort.addEventListener('change', filterAndSort);

    // Initial render
    renderProducts(products);

    // Quick view modal function
    function openQuickView(productId) {
      const product = products.find(p => p.id === productId);
      const quickViewContent = document.getElementById('quickViewContent');
      if (!product) return;
      quickViewContent.innerHTML = `
        <h3 class='text-2xl font-fredoka mb-2'>${product.name}</h3>
        <img src='${product.img}' alt='${product.name}' class='w-full h-64 object-cover rounded-lg mb-4' onerror="this.onerror=null;this.src='https://via.placeholder.com/400x300?text=Image+Unavailable';" />
        <p class='mb-4'>${product.description}</p>
        <p class='text-coral-red font-bold text-lg mb-4'>$${product.price.toFixed(2)}</p>
        <button class='bg-coral-red text-white rounded py-2 px-4 hover:bg-coral-red-dark transition' id='quickViewAddToCart'>Add to Cart</button>
      `;
      quickViewModal.classList.remove('hidden');

      const addToCartBtn = document.getElementById('quickViewAddToCart');
      addToCartBtn.onclick = () => {
        addToCart(product.id);
        closeQuickView();
      };
    }

    function closeQuickView() {
      quickViewModal.classList.add('hidden');
    }

    // Cart, Wishlist, and button event handlers
    const cart = JSON.parse(localStorage.getItem('toyland_cart')) || [];
    const wishlist = JSON.parse(localStorage.getItem('toyland_wishlist')) || [];

    const cartCount = document.getElementById('cartCount');
    const wishlistCount = document.getElementById('wishlistCount');

    function updateCounts() {
      cartCount.textContent = cart.length;
      wishlistCount.textContent = wishlist.length;
    }

    function addToCart(productId) {
      const itemIndex = cart.findIndex(i => i.id === productId);
      if (itemIndex >= 0) {
        cart[itemIndex].qty += 1;
      } else {
        cart.push({id: productId, qty: 1});
      }
      saveCart();
      renderCart();
    }

    function removeFromCart(productId) {
      const itemIndex = cart.findIndex(i => i.id === productId);
      if (itemIndex >= 0) {
        cart.splice(itemIndex, 1);
        saveCart();
        renderCart();
      }
    }

    function changeQty(productId, delta) {
      const itemIndex = cart.findIndex(i => i.id === productId);
      if (itemIndex >= 0) {
        cart[itemIndex].qty += delta;
        if (cart[itemIndex].qty < 1) {
          removeFromCart(productId);
        } else {
          saveCart();
          renderCart();
        }
      }
    }

    function saveCart() {
      localStorage.setItem('toyland_cart', JSON.stringify(cart));
      updateCounts();
    }

    function renderCart() {
      const cartItemsContainer = document.getElementById('cartItems');
      cartItemsContainer.innerHTML = '';
      let total = 0;
      cart.forEach(item => {
        const product = products.find(p => p.id === item.id);
        if (!product) return;
        total += product.price * item.qty;
        const itemDiv = document.createElement('div');
        itemDiv.className = 'flex items-center space-x-4';
        itemDiv.innerHTML = `
          <img src='${product.img}' alt='${product.name}' class='w-16 h-16 object-cover rounded' onerror="this.onerror=null;this.src='https://via.placeholder.com/60?text=NA';" />
          <div class='flex flex-col flex-grow'>
            <span class='font-semibold text-navy'>${product.name}</span>
            <span class='text-coral-red'>$${product.price.toFixed(2)}</span>
            <div class='flex items-center space-x-2 mt-1'>
              <button class='qty-btn bg-yellow-400 rounded px-2' data-id='${product.id}' data-action='decrease'>-</button>
              <span>${item.qty}</span>
              <button class='qty-btn bg-yellow-400 rounded px-2' data-id='${product.id}' data-action='increase'>+</button>
            </div>
          </div>
          <button class='remove-cart-btn text-red-600 hover:text-red-800 font-bold' data-id='${product.id}'></button>
        `;
        cartItemsContainer.appendChild(itemDiv);
      });
      document.getElementById('cartTotal').textContent = `$${total.toFixed(2)}`;
    }

    function addToWishlist(productId) {
      if (!wishlist.includes(productId)) {
        wishlist.push(productId);
        saveWishlist();
      }
    }

    function removeFromWishlist(productId) {
      const idx = wishlist.indexOf(productId);
      if (idx !== -1) {
        wishlist.splice(idx, 1);
        saveWishlist();
      }
    }

    function toggleWishlist(productId) {
      if (wishlist.includes(productId)) {
        removeFromWishlist(productId);
      } else {
        addToWishlist(productId);
      }
      renderWishlist();
    }

    function saveWishlist() {
      localStorage.setItem('toyland_wishlist', JSON.stringify(wishlist));
      updateCounts();
    }

    function renderWishlist() {
      const wishlistItemsContainer = document.getElementById('wishlistItems');
      wishlistItemsContainer.innerHTML = '';
      wishlist.forEach(id => {
        const product = products.find(p => p.id === id);
        if (!product) return;
        const itemDiv = document.createElement('div');
        itemDiv.className = 'flex items-center space-x-4';
        itemDiv.innerHTML = `
          <img src='${product.img}' alt='${product.name}' class='w-12 h-12 object-cover rounded' onerror="this.onerror=null;this.src='https://via.placeholder.com/48?text=NA';" />
          <span class='font-semibold flex-grow text-navy'>${product.name}</span>
          <button class='remove-wishlist-btn text-red-600 hover:text-red-800 font-bold' data-id='${product.id}'></button>
        `;
        wishlistItemsContainer.appendChild(itemDiv);
      });
    }

    function attachEventListeners() {
      document.querySelectorAll('.quick-view-btn').forEach(btn => {
        btn.onclick = (e) => {
          const pid = +e.target.closest('button').dataset.productId;
          openQuickView(pid);
        };
      });

      document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
        btn.onclick = (e) => {
          const pid = +e.target.closest('button').dataset.productId;
          addToCart(pid);
        };
      });

      document.querySelectorAll('.wishlist-toggle-btn').forEach(btn => {
        btn.onclick = (e) => {
          const pid = +e.target.closest('button').dataset.productId;
          toggleWishlist(pid);
        };
      });

      document.querySelectorAll('.qty-btn').forEach(btn => {
        btn.onclick = (e) => {
          const pid = +e.target.dataset.id;
          if (e.target.dataset.action === 'increase') {
            changeQty(pid, 1);
          } else {
            changeQty(pid, -1);
          }
        };
      });

      document.querySelectorAll('.remove-cart-btn').forEach(btn => {
        btn.onclick = (e) => {
          const pid = +e.target.dataset.id;
          removeFromCart(pid);
        };
      });

      document.querySelectorAll('.remove-wishlist-btn').forEach(btn => {
        btn.onclick = (e) => {
          const pid = +e.target.dataset.id;
          removeFromWishlist(pid);
          renderWishlist();
        };
      });
    }

    // Checkout simulation
    document.getElementById('checkoutBtn').addEventListener('click', () => {
      alert('Thank you for your purchase! (Simulation)');
      cart.length = 0;
      saveCart();
      cartDrawer.classList.add('translate-x-full');
    });

    // Initialize counts and renders
    updateCounts();
    renderCart();
    renderWishlist();
  </script>
</body>
</html>
