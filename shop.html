<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shop — WonderBox Kids</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="shop">
  <header class="header">
    <div class="container header-row">
      <a class="logo" href="index.html">WonderBox Kids</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="categories.html">Categories</a>
        <a href="activities.html">Activities</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <a class="action-link" href="wishlist.html">Wishlist <span id="wish-count">0</span></a>
        <a class="action-link" href="cart.html">Cart <span id="cart-count">0</span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="filters">
      <input id="search-box" placeholder="Search products, categories or description" style="flex:1">
      <select id="filter-category"></select>
      <select id="filter-age"></select>
      <select id="filter-price">
        <option value="All">All Prices</option>
        <option value="under-20">Under $20</option>
        <option value="20-40">$20–$40</option>
        <option value="40-70">$40–$70</option>
        <option value="over-70">Over $70</option>
      </select>
      <select id="sort-select">
        <option value="featured">Featured</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="rating-desc">Rating: High to Low</option>
        <option value="name-asc">Name: A to Z</option>
      </select>
    </section>

    <section id="products-grid" class="grid"></section>
    <div id="no-results" style="display:none">No products found.</div>
  </main>

  <footer class="footer">
    <div class="container footer-grid">
      <div>
        <h3>WonderBox Kids</h3>
        <p>Fun Today. Skills for Tomorrow.</p>
      </div>
      <div>
        <h4>Quick Links</h4>
        <a href="shop.html">Shop</a><br>
        <a href="categories.html">Categories</a><br>
        <a href="activities.html">Activities</a><br>
        <a href="about.html">About</a><br>
        <a href="contact.html">Contact</a>
      </div>
      <div>
        <h4>Shop</h4>
        <a href="wishlist.html">Wishlist</a><br>
        <a href="cart.html">Cart</a>
      </div>
      <div>
        <h4>Follow</h4>
        <a href="#">Instagram</a><br>
        <a href="#">Facebook</a>
      </div>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
