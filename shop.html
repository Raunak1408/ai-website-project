<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ToyLand World — Shop</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">ToyLand World</div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart <span class="badge cart-count">0</span></a>
        <button class="icon-btn">Wishlist <span class="badge wish-count">0</span></button>
      </nav>
      <button id="mobileToggle" class="mobile-toggle icon-btn" style="display:none">Menu</button>
    </header>

    <main>
      <div class="shop-controls">
        <input id="searchInput" class="input" placeholder="Search products by title...">
        <select id="categoryFilter" class="input">
          <option>All</option>
          <option>Action Figures</option>
          <option>Educational</option>
          <option>Board Games</option>
          <option>Plush</option>
        </select>
        <select id="sortFilter" class="input">
          <option value="">Default</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>
      </div>

      <section id="shopGrid">
        <div id="productsGrid" class="products-grid"></div>
      </section>
    </main>

    <footer class="footer">© ToyLand World</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
