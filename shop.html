<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shop — ToyLand World</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">ToyLand World</a>
      <nav class="nav" id="main-nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="cart.html">Cart</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <button id="mobile-menu-btn-2" class="mobile-menu-btn">☰</button>
        <button class="icon-btn wishlist-btn" title="Wishlist">❤ <span class="badge" id="wishlist-count">0</span></button>
        <a class="icon-btn cart-link" href="cart.html">🛒 <span class="badge" id="cart-count">0</span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="shop-controls">
      <div class="search-wrap">
        <input id="search-input" type="search" placeholder="Search toys by name...">
      </div>
      <div class="filters">
        <select id="category-filter">
          <option value="All">All Categories</option>
          <option value="Action Figures">Action Figures</option>
          <option value="Educational">Educational</option>
          <option value="Board Games">Board Games</option>
          <option value="Plush">Plush</option>
        </select>
        <select id="sort-filter">
          <option value="default">Sort By</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>
      </div>
    </section>

    <section class="section">
      <div class="products-grid" id="products-grid">
        <!-- Products injected by JS -->
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>© ToyLand World</div>
      <div>Contact: <a href="contact.html">Get in touch</a></div>
    </div>
  </footer>

  <script src="js/main.js" defer></script>
</body>
</html>
