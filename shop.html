<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToyJoy Land - Shop</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header class="header-banner">
        <nav class="navbar">
            <div class="logo">ToyJoy Land</div>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html" class="active">Shop</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><button id="nav-toggle-btn" class="nav-toggle" aria-label="Toggle navigation">&#9776;</button></li>
            </ul>
            <button id="cart-button" aria-label="Toggle Cart" class="nav-toggle">Cart (<span id="cart-count">0</span>)</button>
        </nav>
    </header>

    <main class="container">
        <section class="shop-main">
            <h1>Shop All Toys</h1>
            <div class="category-filters">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="action-figures">Action Figures</button>
                <button class="filter-btn" data-category="puzzles">Puzzles</button>
                <button class="filter-btn" data-category="plush-toys">Plush Toys</button>
            </div>

            <div class="products-grid" id="products-grid">
                <div class="product-card" data-category="action-figures">
                    <img src="https://images.unsplash.com/photo-1600180758896-2f3fd8457689?auto=format&fit=crop&w=400&q=80" alt="Remote Control Car">
                    <div class="product-name">Remote Control Car</div>
                    <div class="product-age">Ages 3+</div>
                    <div class="product-price">$29.99</div>
                    <button class="add-to-cart" data-id="1">Add to Cart</button>
                </div>
                <div class="product-card" data-category="puzzles">
                    <img src="https://images.unsplash.com/photo-1509099836639-18ba9365c41e?auto=format&fit=crop&w=400&q=80" alt="Wooden Puzzle">
                    <div class="product-name">Wooden Puzzle</div>
                    <div class="product-age">Ages 3+</div>
                    <div class="product-price">$19.99</div>
                    <button class="add-to-cart" data-id="2">Add to Cart</button>
                </div>
                <div class="product-card" data-category="plush-toys">
                    <img src="https://images.unsplash.com/photo-151119191912278-7e90b7844243?auto=format&fit=crop&w=400&q=80" alt="Teddy Bear Plush">
                    <div class="product-name">Teddy Bear Plush</div>
                    <div class="product-age">Ages 2+</div>
                    <div class="product-price">$24.99</div>
                    <button class="add-to-cart" data-id="3">Add to Cart</button>
                </div>
                <div class="product-card" data-category="educational-all">
                    <img src="https://images.unsplash.com/photo-1594561058021-e0e4f2a7ae4b?auto=format&fit=crop&w=400&q=80" alt="Educational Kit">
                    <div class="product-name">Educational Kit</div>
                    <div class="product-age">Ages 6+</div>
                    <div class="product-price">$39.99</div>
                    <button class="add-to-cart" data-id="4">Add to Cart</button>
                </div>
            </div>
        </section>

        <div id="cart-modal" class="cart-modal">
            <h2>Your Cart</h2>
            <div id="cart-items"></div>
            <p id="cart-total"></p>
            <button id="checkout-btn" class="btn btn-primary">Checkout</button>
            <button id="close-cart-btn" class="btn">Close</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 ToyJoy Land. All rights reserved.</p>
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="contact.html">Contact</a>
        </div>
        <div class="social-icons">
            <span>FB</span>
            <span>TW</span>
            <span>IG</span>
        </div>
    </footer>
</body>
</html>
