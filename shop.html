<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shop — TinyTrove</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="shop">
  <header class="site-header">
    <div class="container">
      <div class="logo"><a href="index.html">TinyTrove</a></div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="categories.html">Categories</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <button id="wishlist-btn" class="action">❤ <span id="wish-count" class="count">0</span></button>
        <button id="cart-btn" class="action">🛒 <span id="cart-count" class="count">0</span></button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="shop-controls">
      <div class="left">
        <input id="search-box" type="search" placeholder="Search products, categories or descriptions">
      </div>
      <div class="right">
        <select id="sort-select">
          <option value="featured">Featured</option>
          <option value="price-asc">Price Low → High</option>
          <option value="price-desc">Price High → Low</option>
          <option value="rating-desc">Rating High → Low</option>
          <option value="name-asc">Name A → Z</option>
        </select>
      </div>
    </section>

    <section class="filters">
      <div class="filter-group">
        <label>Category</label>
        <select id="filter-category">
          <option>All</option>
          <option>Learning & STEM</option>
          <option>Building & Blocks</option>
          <option>Pretend Play</option>
          <option>Arts & Creativity</option>
          <option>Outdoor Fun</option>
          <option>Puzzles & Games</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Age</label>
        <select id="filter-age">
          <option>All</option>
          <option>2-3</option>
          <option>4-5</option>
          <option>6-7</option>
          <option>8-10</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Price</label>
        <select id="filter-price">
          <option>All</option>
          <option value="under-20">Under $20</option>
          <option value="20-40">$20–$40</option>
          <option value="40-70">$40–$70</option>
          <option value="70+">$70+</option>
        </select>
      </div>
    </section>

    <section>
      <div id="products-grid" class="grid"></div>
      <div id="no-results" class="no-results" style="display:none">No products found.</div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <h4>TinyTrove</h4>
        <p>Little Things. Big Adventures.</p>
      </div>
      <div>
        <h5>Quick Links</h5>
        <a href="shop.html">Shop</a>
        <a href="categories.html">Categories</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
      <div>
        <h5>Account</h5>
        <a href="wishlist.html">Wishlist</a>
        <a href="cart.html">Cart</a>
      </div>
      <div>
        <h5>Follow</h5>
        <a href="#">Instagram</a>
        <a href="#">Facebook</a>
      </div>
    </div>
    <div class="container copyright">© 2026 TinyTrove — All rights reserved.</div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
