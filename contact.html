<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ByteCafe - Contact Us</title>
<link href="style.css" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
<header>
  <div class="logo">ByteCafe</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="about.html">Our Story</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
</header>

<main>
  <section style="max-width: 600px; margin: 3rem auto; padding: 1rem; color: #2c1810;">
    <h1>Contact & Reservation</h1>
    <form action="#" method="post" style="display: flex; flex-direction: column; gap: 1rem;">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />
      <label for="date">Date</label>
      <input id="date" name="date" type="date" required />
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" required></textarea>
      <button type="submit">Submit</button>
    </form>
    <div class="hours" style="margin-top: 2rem;">
      <strong>Store Hours:</strong> Mon-Sat: 7AM - 9PM
    </div>
  </section>
</main>

<footer>
  <div class="hours">Store Hours: Mon-Sat 7AM - 9PM</div>
  <div class="social">
    <a href="#" aria-label="Facebook">Facebook</a>
    <a href="#" aria-label="Twitter">Twitter</a>
    <a href="#" aria-label="Instagram">Instagram</a>
  </div>
</footer>
</body>
</html>
