<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — ToyNest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container" style="max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:14px 16px;">
      <div class="logo">ToyNest</div>
      <button class="nav-toggle" aria-controls="main-navigation" aria-expanded="false" aria-label="Open menu"><span class="hamburger"></span></button>
      <nav id="main-navigation" class="nav main-nav" aria-hidden="false">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="cart.html" class="cart-link">Cart <span class="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="contact-form-section">
      <h2>Contact Us</h2>
      <form id="contact-form" class="contact-form">
        <label for="c-name">Name</label>
        <input id="c-name" name="name" required>

        <label for="c-email">Email</label>
        <input id="c-email" name="email" type="email" required>

        <label for="c-subject">Subject</label>
        <input id="c-subject" name="subject" required>

        <label for="c-message">Message</label>
        <textarea id="c-message" name="message" rows="6" required></textarea>

        <button type="submit" class="btn btn-primary">Send Message</button>
        <div id="contact-feedback" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">ToyNest — Premium toys for curious kids.</div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
