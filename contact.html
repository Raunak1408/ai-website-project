<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact - Toykart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="hero-grid container">
      <div class="logo">Toykart</div>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart <span class="cart-count">0</span></a>
        <a href="contact.html" class="active">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="contact-form-section">
      <section class="contact-form">
        <h2>Contact Us</h2>
        <form id="contact-form" class="contact-form">
          <label>Name<br><input id="c-name" required /></label>
          <label>Email<br><input id="c-email" type="email" required /></label>
          <label>Message<br><textarea id="c-message" rows="6" required></textarea></label>
          <button class="btn btn-primary" type="submit">Send Message</button>
        </form>
      </section>

      <section class="about">
        <h3>About Us</h3>
        <p>Toykart is a focused toy store built as a demo — curated toys across action figures, soft toys, puzzles, remote control and educational kits. We care about safe, age-appropriate play.</p>
      </section>
    </section>
  </main>

  <footer class="site-footer container">
    <div>© Toykart - Toys only store</div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
