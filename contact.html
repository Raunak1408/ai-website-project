<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToyJoy Land - Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header class="header-banner">
        <nav class="navbar">
            <div class="logo">ToyJoy Land</div>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><button id="cart-button">Cart (<span id="cart-count">0</span>)</button></li>
            </ul>
            <button class="nav-toggle" id="nav-toggle">&#9776;</button>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h1>Contact / Support</h1>
            <form id="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit" class="btn-primary">Send Message</button>
            </form>
            <div class="store-info">
                <h2>Our Store Location & Hours</h2>
                <p>123 Joy Street, Playtown, Funland</p>
                <p>Monday - Friday: 9:00 AM - 6:00 PM</p>
                <p>Saturday: 10:00 AM - 4:00 PM</p>
                <p>Sunday: Closed</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 ToyJoy Land. All rights reserved.</p>
    </footer>
</body>
</html>
