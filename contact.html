<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | ToyVerse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { heading: ['Fredoka', 'cursive'], sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { toyRed: '#FF4757', toyYellow: '#FFA502', toyBlue: '#1E90FF' }
                }
            }
        }
    </script>
</head>
<body class="bg-amber-50/50 text-slate-800 font-sans flex flex-col min-h-screen">

    <header class="bg-white shadow-md sticky top-0 z-50 border-b-4 border-toyYellow">
        <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-2xl font-heading font-bold text-toyRed">
                <i class="fa-solid fa-robot text-toyBlue"></i> TOY<span class="text-toyYellow">VERSE</span>
            </a>
            <nav class="flex gap-6 font-semibold text-sm">
                <a href="index.html" class="hover:text-toyBlue">Home</a>
                <a href="categories.html" class="hover:text-toyBlue">Categories</a>
                <a href="about.html" class="hover:text-toyBlue">Our Story</a>
                <a href="contact.html" class="text-toyRed font-bold border-b-2 border-toyRed pb-1">Contact Us</a>
            </nav>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-6 py-12 flex-1">
        <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
            <h1 class="font-heading text-3xl font-bold text-slate-800 text-center mb-2">Get in Touch</h1>
            <p class="text-xs text-slate-500 text-center mb-6">Have questions about order status or toy recommendations?</p>

            <form onsubmit="event.preventDefault(); alert('Message sent! Our support team will reply within 24 hours.');" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Your Name</label>
                    <input type="text" required placeholder="Jane Doe" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-toyBlue">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Email Address</label>
                    <input type="email" required placeholder="jane@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-toyBlue">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Message</label>
                    <textarea rows="4" required placeholder="How can we help?" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-toyBlue"></textarea>
                </div>
                <button type="submit" class="w-full bg-toyRed hover:bg-red-600 text-white font-extrabold py-3.5 rounded-xl shadow transition">
                    Send Message
                </button>
            </form>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-8 border-t-4 border-toyRed text-center text-xs">
        &copy; 2026 ToyVerse Inc. All rights reserved.
    </footer>
</body>
</html>
