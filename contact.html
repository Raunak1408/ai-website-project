<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — ToyLand World</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">ToyLand World</div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart <span class="badge cart-count">0</span></a>
      </nav>
    </header>

    <main>
      <h1>Contact Us</h1>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
        <div>
          <form id="contactForm">
            <div class="input-field"><label>Name</label><input class="input" name="name" required></div>
            <div class="input-field"><label>Email</label><input class="input" name="email" type="email" required></div>
            <div class="input-field"><label>Subject</label><input class="input" name="subject"></div>
            <div class="input-field"><label>Message</label><textarea class="input" name="message" rows="6" required></textarea></div>
            <button class="btn" type="submit">Send Message</button>
          </form>
        </div>
        <aside>
          <h3>Store Location</h3>
          <p>123 Play Ave, Fun City, FC 45678</p>
          <h3>Working Hours</h3>
          <p>Mon-Sat: 9am - 7pm<br>Sun: 10am - 5pm</p>

          <h3>FAQ</h3>
          <details><summary>What is your return policy?</summary><p>30-day returns on unused items.</p></details>
          <details><summary>Do you ship internationally?</summary><p>Yes — shipping rates apply.</p></details>
        </aside>
      </div>
    </main>

    <footer class="footer">© ToyLand World</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
