<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — LittleLearners</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="logo"><a href="index.html">LittleLearners</a></div>
      <nav id="main-navigation" class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="activities.html">Activities</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="cart.html" class="cart-link">Cart <span class="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h1>Contact Us</h1>
      <form id="contact-form" class="contact-form">
        <label>Name <input id="c-name" type="text" required></label>
        <label>Email <input id="c-email" type="email" required></label>
        <label>Subject <input id="c-subject" type="text"></label>
        <label>Message <textarea id="c-message" rows="6" required></textarea></label>
        <button type="submit" class="btn btn-primary">Send Message</button>
        <div id="contact-feedback" role="status" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="about">LittleLearners — premium educational toys for curious kids.</div>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="data.js"></script>
</body>
</html>
