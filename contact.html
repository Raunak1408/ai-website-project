<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WonderToys - Contact Us</title>
<link rel="stylesheet" href="style.css" />
<script defer src="app.js"></script>
</head>
<body>
<header class="header">
  <div class="container header-container">
    <div class="logo">WonderToys</div>
    <nav class="nav">
      <ul class="nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="cart.html">Cart <span class="cart-badge" id="cart-count">0</span></a></li>
        <li><a href="contact.html" class="active">Contact Us</a></li>
      </ul>
      <div class="nav-search">
        <input type="search" id="search-contact" placeholder="Search toys..." aria-label="Search toys" />
      </div>
      <button class="mobile-menu-toggle" aria-label="Toggle navigation">
        &#9776;
      </button>
    </nav>
  </div>
</header>

<main class="contact container">
  <section class="store-info">
    <h2>Contact WonderToys</h2>
    <p><strong>Address:</strong> 123 Playtime Lane, Fun City, TX 75001</p>
    <p><strong>Email:</strong> support@wondertoys.com</p>
    <p><strong>Working Hours:</strong> Mon-Fri 9am - 6pm</p>
  </section>

  <section class="contact-form-section">
    <h2>Send Us a Message</h2>
    <form id="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" />

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit" class="btn-primary">Send Message</button>
    </form>
  </section>
</main>

<footer class="footer">
  <div class="container footer-container">
    <div class="footer-left">
      <h3>WonderToys</h3>
      <p>Bringing joy to playtime!</p>
    </div>
    <div class="footer-right">
      <div class="social-links">
        <a href="#" aria-label="Facebook"><img src="https://img.icons8.com/color/48/000000/facebook-new.png" alt="Facebook" /></a>
        <a href="#" aria-label="Twitter"><img src="https://img.icons8.com/color/48/000000/twitter.png" alt="Twitter" /></a>
        <a href="#" aria-label="Instagram"><img src="https://img.icons8.com/color/48/000000/instagram-new.png" alt="Instagram" /></a>
      </div>
      <form class="newsletter-form" aria-label="Subscribe to newsletter">
        <input type="email" placeholder="Your email address" aria-label="Email address" required />
        <button type="submit">Subscribe</button>
      </form>
    </div>
  </div>
</footer>

</body>
</html>
