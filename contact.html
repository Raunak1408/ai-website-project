<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToyJoy Land - Contact</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
</head>
<body>
    <header class="header-banner">
        <nav class="navbar">
            <div class="logo">ToyJoy Land</div>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><button id="nav-toggle-btn" class="nav-toggle" aria-label="Toggle navigation">&#9776;</button></li>
            </ul>
            <button id="cart-button" aria-label="Toggle Cart" class="nav-toggle">Cart (<span id="cart-count">0</span>)</button>
        </nav>
    </header>

    <main class="container">
        <section class="contact-section">
            <h1>Contact & Support Form</h1>
            <form id="contact-form" class="contact-form" novalidate>
                <label for="name">Parent's Name:</label>
                <input type="text" id="name" name="name" required />

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required />

                <label for="category">Toy Category Interest:</label>
                <select id="category" name="category" required>
                    <option value="">Select one</option>
                    <option value="action-figures">Action Figures</option>
                    <option value="educational-all">Educational Toys</option>
                    <option value="puzzles">Board Games</option>
                    <option value="plush-toys">Plush Toys</option>
                </select>

                <label for="message">Inquiry Message:</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
            <div id="form-success" class="form-success hidden" role="alert">Thank you for your inquiry! We will get back to you soon.</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 ToyJoy Land. All rights reserved.</p>
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="contact.html">Contact</a>
        </div>
        <div class="social-icons">
            <span>FB</span>
            <span>TW</span>
            <span>IG</span>
        </div>
    </footer>
</body>
</html>
