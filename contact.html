<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — WonderSprout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
  <header class="site-header">
    <div class="container header-row">
      <a class="logo" href="index.html">WonderSprout</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="activities.html">Activities</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="header-actions">
        <a class="action" href="favorites.html">Favorites <span id="fav-count">0</span></a>
        <a class="action" href="cart.html">Cart <span id="cart-count">0</span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <h2>Contact Us</h2>
    <form id="contact-form" class="contact-form">
      <label>Name<input id="c-name" required></label>
      <label>Email<input id="c-email" type="email" required></label>
      <label>Subject<input id="c-subject" required></label>
      <label>Message<textarea id="c-message" rows="5" required></textarea></label>
      <button class="btn primary" type="submit">Send Message</button>
      <div id="contact-feedback" class="form-feedback" aria-live="polite"></div>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <h3>WonderSprout</h3>
        <p>Play. Learn. Imagine — premium activity kits and educational games for curious kids.</p>
      </div>
      <div>
        <h4>Quick Links</h4>
        <ul>
          <li><a href="games.html">Games</a></li>
          <li><a href="activities.html">Activities</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
    <div class="container copyright">© WonderSprout 2026</div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
