<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — ToyNest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="hero-grid container">
      <div class="logo">ToyNest</div>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="cart.html">Cart <span class="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="contact-form-section">
      <h2>Contact Us</h2>
      <form id="contact-form" class="contact-form">
        <label>Name<br><input id="c-name" required></label>
        <label>Email<br><input id="c-email" type="email" required></label>
        <label>Subject<br><input id="c-subject" required></label>
        <label>Message<br><textarea id="c-message" rows="6" required></textarea></label>
        <button type="submit" class="btn btn-primary">Send Message</button>
        <div id="contact-feedback" role="status" aria-live="polite"></div>
      </form>
    </section>

    <section class="about">
      <h3>Need help?</h3>
      <p>Our customer care team is ready to help with product questions, returns and safety information.</p>
    </section>
  </main>

  <footer class="site-footer container">
    <div>ToyNest — Premium toys for curious kids</div>
    <nav>
      <a href="products.html">Products</a> ·
      <a href="about.html">About</a> ·
      <a href="contact.html">Contact</a>
    </nav>
    <div>© ToyNest</div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
