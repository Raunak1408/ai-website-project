<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew & Bean Cafe - Contact</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
<header>
    <div class="container">
        <div class="logo">Brew & Bean Cafe</div>
        <nav>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><button id="cart-button">Cart (<span id="cart-count">0</span>)</button></li>
                <li class="nav-toggle"><button aria-label="Toggle navigation" id="nav-toggle-btn">&#9776;</button></li>
            </ul>
        </nav>
    </div>
</header>

<main class="container">
    <h1>Contact / Reservation</h1>

    <form id="contact-form" class="contact-section" novalidate>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required>

        <label for="time">Time:</label>
        <input type="time" id="time" name="time" required>

        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" name="guests" min="1" required>

        <label for="requests">Special Requests:</label>
        <textarea id="requests" name="requests" rows="4"></textarea>

        <button type="submit" class="btn btn-primary">Send Reservation</button>
    </form>
</main>

<footer>
    <p>&copy; 2024 Brew & Bean Cafe. All rights reserved.</p>
</footer>

</body>
</html>
