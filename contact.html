<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WonderToys - Contact Us</title>
<link rel="stylesheet" href="style.css" />
<script defer src="app.js"></script>
</head>
<body>
<header class="header">
  <div class="container header-container">
    <div class="logo">WonderToys</div>
    <nav class="nav">
      <ul class="nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="cart.html">Cart <span id="cart-count">0</span></a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
    <input
      type="search"
      placeholder="Search toys..."
      aria-label="Search toys"
      class="search-bar"
    />
    <button class="mobile-menu-toggle" aria-label="Toggle navigation">
      &#9776;
    </button>
  </div>
</header>
<main class="contact-main container">
  <section class="store-info">
    <h2>Store Details</h2>
    <p><strong>Address:</strong> 123 Playful Lane, Toy City, TC 56789</p>
    <p><strong>Support Email:</strong> <a href="mailto:support@wondertoys.com">support@wondertoys.com</a></p>
    <p><strong>Working Hours:</strong> Mon-Fri 9am - 6pm</p>
  </section>
  <section class="contact-form-section">
    <h2>Contact Us</h2>
    <form class="contact-form" aria-label="Contact Us Form">
      <label for="contact-name">Name:</label>
      <input type="text" id="contact-name" name="contact-name" required />

      <label for="contact-email">Email:</label>
      <input type="email" id="contact-email" name="contact-email" required />

      <label for="contact-subject">Subject:</label>
      <input type="text" id="contact-subject" name="contact-subject" required />

      <label for="contact-message">Message:</label>
      <textarea id="contact-message" name="contact-message" rows="4" required></textarea>

      <button type="submit" class="btn-primary">Send Message</button>
    </form>
  </section>
</main>
<footer class="footer">
  <div class="container footer-container">
    <div class="footer-left">
      <p>&copy; 2024 WonderToys. All rights reserved.</p>
    </div>
    <div class="footer-right social-links">
      <a href="#" aria-label="Facebook"><img src="https://img.icons8.com/color/48/000000/facebook-new.png" alt="Facebook" /></a>
      <a href="#" aria-label="Twitter"><img src="https://img.icons8.com/color/48/000000/twitter--v1.png" alt="Twitter" /></a>
      <a href="#" aria-label="Instagram"><img src="https://img.icons8.com/color/48/000000/instagram-new.png" alt="Instagram" /></a>
    </div>
    <form class="newsletter-form" aria-label="Subscribe to newsletter">
      <input type="email" placeholder="Your email address" aria-label="Email address" required />
      <button type="submit" class="btn-primary">Subscribe</button>
    </form>
  </div>
</footer>
</body>
</html>
