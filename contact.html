<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ToyLand World</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ToyLand World</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Get in Touch</h2>
        <p>We'd love to hear from you! Reach out for any inquiries or support.</p>
    </section>

    <main style="max-width: 600px; margin: 3rem auto; padding: 0 1.5rem; flex: 1;">
        <div class="card" style="text-align: left;">
            <h3 style="margin-bottom: 1rem; text-align: center;">Send Us a Message</h3>
            <form onsubmit="event.preventDefault(); alert('Message sent successfully!');">
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-weight: 500; margin-bottom: 0.5rem;">Your Name</label>
                    <input type="text" required placeholder="Enter your name" style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-weight: 500; margin-bottom: 0.5rem;">Email Address</label>
                    <input type="email" required placeholder="Enter your email" style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-weight: 500; margin-bottom: 0.5rem;">Message</label>
                    <textarea rows="4" required placeholder="How can we help you?" style="width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px;"></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ToyLand World. All Rights Reserved.</p>
    </footer>
</body>
</html>
