<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — ToyLand World</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html">ToyLand World</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart</a>
      </nav>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="icon-btn">🔍</button>
        <a class="icon-btn" href="wishlist.html">❤ <span class="badge wish-count">0</span></a>
        <a class="icon-btn" href="cart.html">🛒 <span class="badge cart-count">0</span></a>
        <button class="mobile-toggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="contact-grid">
      <div>
        <h1>Contact Us</h1>
        <form id="contactForm">
          <div class="input-field"><label>Name</label><input name="name" required></div>
          <div class="input-field"><label>Email</label><input name="email" type="email" required></div>
          <div class="input-field"><label>Subject</label><input name="subject"></div>
          <div class="input-field"><label>Message</label><textarea name="message" rows="6" required></textarea></div>
          <button class="btn" type="submit">Send Message</button>
        </form>
      </div>
      <aside>
        <div class="faq">
          <h3>Store Location</h3>
          <p>123 Play Avenue, Fun City</p>
          <h3>Working Hours</h3>
          <p>Mon-Sat: 9am - 7pm</p>
          <h3>FAQ</h3>
          <div class="accordion-item"><div class="accordion-title">Shipping times</div><div class="accordion-content">Orders ship in 1-3 business days.</div></div>
          <div class="accordion-item"><div class="accordion-title">Return Policy</div><div class="accordion-content">30-day returns on unopened items.</div></div>
        </div>
      </aside>
    </div>
  </main>

  <footer class="footer container">© ToyLand World</footer>

  <script src="app.js"></script>
  <script>document.addEventListener('DOMContentLoaded',()=>{if(typeof initContact==='function')initContact()});</script>
</body>
</html>
