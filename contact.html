<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | ByteCafe</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;600&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: #faf8f5; color: #2d2d2d; line-height: 1.6; }
        
        header { background: #1e120b; padding: 1.2rem 8%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        header h1 { font-family: 'Playfair Display', serif; color: #c69244; font-size: 1.8rem; margin: 0; }
        nav a { color: #f2e9e1; text-decoration: none; margin-left: 2rem; font-weight: 500; font-size: 0.95rem; transition: color 0.3s; }
        nav a:hover, nav a.active { color: #c69244; }

        main { max-width: 800px; margin: 4rem auto; padding: 0 1.5rem; }
        .section-title { text-align: center; font-family: 'Playfair Display', serif; font-size: 2.3rem; color: #1e120b; margin-bottom: 2rem; }
        
        .contact-container { background: #ffffff; padding: 3rem; border-radius: 16px; border: 1px solid #f0e6dd; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: #1e120b; font-size: 0.95rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.8rem 1rem; border: 1px solid #ddd; border-radius: 8px; font-family: 'Poppins', sans-serif; font-size: 0.95rem; background: #fafafa; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #c69244; background: #fff; }

        .gold-btn { background-color: #c69244 !important; color: #ffffff !important; padding: 0.85rem 2rem !important; text-decoration: none !important; font-weight: 600 !important; border-radius: 25px !important; display: block !important; width: 100% !important; transition: all 0.3s ease !important; box-shadow: 0 4px 12px rgba(198, 146, 68, 0.35) !important; border: none !important; cursor: pointer !important; font-size: 1rem !important; margin-top: 1rem !important; }
        .gold-btn:hover { background-color: #a87932 !important; }

        footer { background: #1e120b; color: #a89a8e; text-align: center; padding: 2.5rem 1.5rem; margin-top: 5rem; border-top: 3px solid #c69244; }
        footer p { margin-bottom: 0.4rem; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <h1>ByteCafe</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">Our Story</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>
        <h2 class="section-title">Get In Touch</h2>
        <div class="contact-container">
            <form onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent.');">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="How can we help you?" required></textarea>
                </div>
                <button type="submit" class="gold-btn">Send Message</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ByteCafe. All rights reserved.</p>
    </footer>
</body>
</html>
