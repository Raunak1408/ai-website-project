<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WonderBox Kids — Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
  <header class="site-header">
    <div class="container header-row">
      <div class="logo"><a href="index.html"><img src="assets/logo.svg" alt="WonderBox Kids logo"></a></div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="categories.html">Categories</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="actions">
        <a href="wishlist.html" class="icon">♡ <span id="wish-count">0</span></a>
        <a href="cart.html" class="icon">🛒 <span id="cart-count">0</span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <h2>Contact Us</h2>
    <form id="contact-form" class="card">
      <label>Name <input id="c-name" required></label>
      <label>Email <input id="c-email" type="email" required></label>
      <label>Message <textarea id="c-message" rows="5" required></textarea></label>
      <button class="btn" type="submit">Send Message</button>
      <p id="contact-msg" class="muted"></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container">© <span id="year"></span> WonderBox Kids</div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
