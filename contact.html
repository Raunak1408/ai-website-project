<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WonderBox Kids — Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
  <header class="site-header">
    <div class="container header-row">
      <div class="logo">WonderBox Kids</div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="categories.html">Categories</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="actions">
        <a href="wishlist.html" class="action">❤ <span id="wish-count">0</span></a>
        <a href="cart.html" class="action">🛒 <span id="cart-count">0</span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <h1>Contact Us</h1>
    <form id="contact-form">
      <label>Name <input id="c-name" required></label>
      <label>Email <input id="c-email" type="email" required></label>
      <label>Message <textarea id="c-message" rows="5" required></textarea></label>
      <button type="submit" class="btn">Send Message</button>
    </form>
    <div id="contact-msg" role="status"></div>
  </main>

  <footer class="site-footer"><div class="container"><p>© WonderBox Kids</p></div></footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
