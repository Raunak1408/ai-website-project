<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — WonderBox Kids</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
  <header class="site-header">
    <div class="site-top container">
      <div class="logo"><img src="assets/logo.svg" alt="WonderBox Kids"></div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="actions">
        <a href="wishlist.html" class="icon">♡ <span id="wish-count">0</span></a>
        <a href="cart.html" class="icon">🛒 <span id="cart-count">0</span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <h2>Contact Us</h2>
    <form id="contact-form" class="inline-form">
      <label>Name <input id="c-name" required></label><br><br>
      <label>Email <input id="c-email" type="email" required></label><br><br>
      <label>Message <textarea id="c-message" rows="5" required></textarea></label><br><br>
      <button class="btn" type="submit">Send</button>
    </form>
    <p id="contact-msg"></p>
  </main>

  <footer class="footer">WonderBox Kids — get in touch</footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script>
    document.getElementById('contact-form').addEventListener('submit',function(e){e.preventDefault();const name=document.getElementById('c-name').value;document.getElementById('contact-msg').textContent='Thanks '+name+' — we received your message.';this.reset()});
  </script>
</body>
</html>
