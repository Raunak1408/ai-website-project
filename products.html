<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Products — ToyNest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container" style="max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:14px 16px;">
      <div class="logo">ToyNest</div>
      <button class="nav-toggle" aria-controls="main-navigation" aria-expanded="false" aria-label="Open menu"><span class="hamburger"></span></button>
      <nav id="main-navigation" class="nav main-nav" aria-hidden="false">
        <a href="index.html">Home</a>
        <a href="products.html" class="active">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html" class="cart-link">Cart <span class="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="products-layout">
      <aside class="sidebar">
        <h3>Filters</h3>
        <div id="filter-categories"></div>
        <div id="price-range"></div>
        <div id="age-select"></div>
        <div class="filter-actions"><button id="clear-filters" class="btn">Reset Filters</button></div>
      </aside>

      <section class="products-area">
        <div class="products-top">
          <label>Sort:</label>
          <select id="sort-select">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: Low → High</option>
            <option value="price-desc">Price: High → Low</option>
            <option value="rating-desc">Rating</option>
            <option value="name-asc">Name</option>
          </select>
          <input id="search-box" placeholder="Search toys...">
        </div>

        <div id="products-grid" class="featured-grid"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">ToyNest — Premium toys for curious kids. <a href="about.html">About</a> • <a href="contact.html">Contact</a></div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
