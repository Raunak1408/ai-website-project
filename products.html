<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shop — WonderBox Kids</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="products">
  <header class="site-header">
    <div class="site-top container">
      <div class="logo"><img src="assets/logo.svg" alt="WonderBox Kids"></div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="actions">
        <a href="wishlist.html" class="icon">♡ <span id="wish-count">0</span></a>
        <a href="cart.html" class="icon">🛒 <span id="cart-count">0</span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="filters">
      <select id="filter-category" class="select"></select>
      <select id="filter-age" class="select"></select>
      <select id="sort-select" class="select">
        <option value="">Sort</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
      </select>
      <input id="search-input" class="input" placeholder="Search toys by name or description">
      <button id="clear-filters" class="btn">Clear</button>
    </section>

    <section id="products-grid"></section>
  </main>

  <footer class="footer">WonderBox Kids • curated toys for curious kids</footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
  <script>
    document.getElementById('clear-filters').addEventListener('click',()=>{document.getElementById('filter-category').value='';document.getElementById('filter-age').value='';document.getElementById('sort-select').value='';document.getElementById('search-input').value='';document.querySelector('#search-input').dispatchEvent(new Event('input'))});
  </script>
</body>
</html>
