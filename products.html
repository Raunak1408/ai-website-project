<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WonderBox Kids — Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="products">
  <header class="site-header">
    <div class="container header-row">
      <div class="logo">WonderBox Kids</div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="categories.html">Categories</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="actions">
        <a href="wishlist.html" class="action">❤ <span id="wish-count">0</span></a>
        <a href="cart.html" class="action">🛒 <span id="cart-count">0</span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="controls">
      <input id="search-input" type="search" placeholder="Search toys by name or description">
      <select id="filter-category"><option value="">All categories</option></select>
      <select id="filter-age"><option value="">All ages</option></select>
      <select id="sort-select">
        <option value="relevance">Sort: Relevance</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="rating-desc">Rating</option>
      </select>
      <button id="clear-filters" class="btn">Clear</button>
    </section>

    <section>
      <div id="products-grid" class="products-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© WonderBox Kids</p>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
