<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shop — WonderBox Kids</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="products">
  <header class="site-header">
    <div class="container header-row">
      <a class="logo" href="index.html">WonderBox Kids</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="products.html">Shop</a>
        <a href="categories.html">Categories</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="actions">
        <input id="search-box-page" class="search" placeholder="Search toys">
        <a href="wishlist.html" class="action-link">Wishlist <span id="wish-count-2" class="count">0</span></a>
        <a href="cart.html" class="action-link">Cart <span id="cart-count-2" class="count">0</span></a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="shop-grid">
      <aside class="filters">
        <h3>Filters</h3>
        <label>Category
          <select id="filter-category"><option value="All">All</option></select>
        </label>
        <label>Age
          <select id="filter-age"><option value="All">All</option><option>0-2</option><option>3-5</option><option>6-8</option></select>
        </label>
        <label>Price
          <select id="filter-price"><option value="All">All</option><option value="0-20">Under $20</option><option value="20-50">$20–50</option><option value="50-9999">$50+</option></select>
        </label>
        <h3>Sort</h3>
        <select id="sort-select"><option value="relevance">Relevance</option><option value="price-asc">Price — low to high</option><option value="price-desc">Price — high to low</option></select>
        <button id="clear-filters" class="btn-ghost">Clear</button>
      </aside>

      <section class="product-list">
        <div class="list-controls">
          <div><strong id="result-count">0</strong> results</div>
          <input id="search-inline" class="search" placeholder="Search in results">
        </div>
        <div id="products-grid" class="products-grid"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <h4>WonderBox Kids</h4>
        <p>Playful learning toys for curious kids.</p>
      </div>
      <div>
        <h4>Help</h4>
        <a href="contact.html">Contact</a>
        <a href="about.html">About</a>
      </div>
      <div>
        <h4>Follow</h4>
        <a href="#">Instagram</a>
        <a href="#">Facebook</a>
      </div>
    </div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js" defer></script>
</body>
</html>
