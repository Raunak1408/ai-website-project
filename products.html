<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Products — ToyNest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="hero-grid container">
      <div class="logo">ToyNest</div>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="products.html" class="active">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart <span class="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="products-layout">
      <aside class="sidebar">
        <h3>Filters</h3>
        <div id="filter-categories"></div>
        <div class="filter-section">
          <h4>Price</h4>
          <div id="price-range"></div>
        </div>
        <div class="filter-section">
          <h4>Age Group</h4>
          <select id="age-select"><option value="all">All ages</option></select>
        </div>
        <div class="filter-actions">
          <button id="clear-filters" class="btn">Reset Filters</button>
        </div>
      </aside>

      <section class="products-area">
        <div class="products-top">
          <label>Sort:</label>
          <select id="sort-select">
            <option value="default">Featured</option>
            <option value="price-asc">Price: Low → High</option>
            <option value="price-desc">Price: High → Low</option>
            <option value="rating-desc">Rating</option>
            <option value="name-asc">Name</option>
          </select>
          <input id="search-box" placeholder="Search toys...">
        </div>

        <div id="products-grid" class="feature-grid"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer container">
    <div>ToyNest — Premium toys for curious kids</div>
    <nav>
      <a href="products.html">Products</a> ·
      <a href="about.html">About</a> ·
      <a href="contact.html">Contact</a>
    </nav>
    <div>© ToyNest</div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
