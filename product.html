<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WonderToys - Product Details</title>
<link rel="stylesheet" href="style.css" />
<script defer src="app.js"></script>
</head>
<body>
<header class="header">
  <div class="container header-container">
    <div class="logo">WonderToys</div>
    <nav class="nav">
      <ul class="nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="cart.html">Cart <span id="cart-count">0</span></a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <input
      type="search"
      placeholder="Search toys..."
      aria-label="Search toys"
      class="search-bar"
    />
    <button class="mobile-menu-toggle" aria-label="Toggle navigation">
      &#9776;
    </button>
  </div>
</header>
<main class="product-detail container">
  <div class="image-gallery">
    <img
      id="main-product-image"
      src="https://images.unsplash.com/photo-1589745328128-9ebea505f061?auto=format&fit=crop&w=600&q=80"
      alt="Product Main"
    />
    <div class="thumbnail-row">
      <img
        src="https://images.unsplash.com/photo-1589745328128-9ebea505f061?auto=format&fit=crop&w=150&q=80"
        alt="Product View 1"
        class="thumbnail active"
      />
      <img
        src="https://images.unsplash.com/photo-1608078202966-0ff8314b7c9f?auto=format&fit=crop&w=150&q=80"
        alt="Product View 2"
        class="thumbnail"
      />
      <img
        src="https://images.unsplash.com/photo-1545035637-6ab98e6f12a1?auto=format&fit=crop&w=150&q=80"
        alt="Product View 3"
        class="thumbnail"
      />
    </div>
  </div>

  <div class="product-info">
    <h1>Robot Action Figure</h1>
    <div class="star-rating">★★★★★</div>
    <p class="price">$34.99</p>
    <p class="stock-status in-stock">In Stock</p>
    <p class="age-suitability">Suitable for ages: 8+</p>
    <p class="safety-guidelines">100% Safe & Non-Toxic Materials</p>

    <div class="quantity-selector">
      <label for="quantity">Quantity:</label>
      <input type="number" id="quantity" name="quantity" value="1" min="1" />
    </div>

    <div class="product-actions">
      <button class="btn-primary" id="add-to-cart">Add to Cart</button>
      <button class="btn-secondary" id="buy-now">Buy Now</button>
    </div>
  </div>
</main>

<section class="related-products container">
  <h2>Related Toys</h2>
  <div class="product-grid">
    <article class="product-card">
      <img
        src="https://images.unsplash.com/photo-1560807707-8cc77767d783?auto=format&fit=crop&w=400&q=80"
        alt="Plush Doll"
      />
      <h3>Plush Doll</h3>
      <div class="star-rating">★★★★★</div>
      <p class="price">$25.00</p>
      <button class="btn-primary btn-add-cart">Add to Cart</button>
    </article>
    <article class="product-card">
      <img
        src="https://images.unsplash.com/photo-1519125323398-675f0ddb6308?auto=format&fit=crop&w=400&q=80"
        alt="Board Game"
      />
      <h3>Board Game</h3>
      <div class="star-rating">★★★★☆</div>
      <p class="price">$34.99</p>
      <button class="btn-primary btn-add-cart">Add to Cart</button>
    </article>
    <article class="product-card">
      <img
        src="https://images.unsplash.com/photo-1506527680888-33193006b945?auto=format&fit=crop&w=400&q=80"
        alt="Puzzle Toy"
      />
      <h3>Puzzle Toy</h3>
      <div class="star-rating">★★★★☆</div>
      <p class="price">$29.99</p>
      <button class="btn-primary btn-add-cart">Add to Cart</button>
    </article>
  </div>
</section>

<footer class="footer">
  <div class="container footer-container">
    <div class="footer-left">
      <p>&copy; 2024 WonderToys. All rights reserved.</p>
    </div>
    <div class="footer-right social-links">
      <a href="#" aria-label="Facebook"><img src="https://img.icons8.com/color/48/000000/facebook-new.png" alt="Facebook" /></a>
      <a href="#" aria-label="Twitter"><img src="https://img.icons8.com/color/48/000000/twitter--v1.png" alt="Twitter" /></a>
      <a href="#" aria-label="Instagram"><img src="https://img.icons8.com/color/48/000000/instagram-new.png" alt="Instagram" /></a>
    </div>
    <form class="newsletter-form" aria-label="Subscribe to newsletter">
      <input type="email" placeholder="Your email address" aria-label="Email address" required />
      <button type="submit" class="btn-primary">Subscribe</button>
    </form>
  </div>
</footer>
</body>
</html>
