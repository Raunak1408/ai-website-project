<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WonderToys - Product Details</title>
<link rel="stylesheet" href="style.css" />
<script defer src="app.js"></script>
</head>
<body>
<header class="header">
  <div class="container header-container">
    <div class="logo">WonderToys</div>
    <nav class="nav">
      <ul class="nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="cart.html">Cart <span class="cart-badge" id="cart-count">0</span></a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
      <div class="nav-search">
        <input type="search" aria-label="Search toys" placeholder="Search toys..." id="search-shop" />
      </div>
      <button class="mobile-menu-toggle" aria-label="Toggle navigation">
        &#9776;
      </button>
    </nav>
  </div>
</header>

<main class="product-detail">
  <div class="container product-info">
    <div class="image-gallery">
      <div class="main-image">
        <img src="https://images.unsplash.com/photo-1589749473933-1a18b4f5b4e3?auto=format&fit=crop&w=400&q=80" alt="Robot Action Figure" id="main-product-image" />
      </div>
      <div class="thumbnail-row">
        <img src="https://images.unsplash.com/photo-1589749473933-1a18b4f5b4e3?auto=format&fit=crop&w=100&q=80" alt="Robot Action Figure" class="thumbnail active" />
        <img src="https://images.unsplash.com/photo-1504274066651-8d31a536b11a?auto=format&fit=crop&w=100&q=80" alt="Toy Robot Side" class="thumbnail" />
        <img src="https://images.unsplash.com/photo-1532726637243-f9ca43e3bb06?auto=format&fit=crop&w=100&q=80" alt="Robot in Action" class="thumbnail" />
      </div>
    </div>
    <div class="product-details">
      <h1>Robot Action Figure</h1>
      <div class="rating">★★★★★</div>
      <div class="price">$29.99</div>
      <div class="stock-status in-stock">In Stock</div>
      <div class="age-suitability">Suitable for Ages: 8+</div>
      <div class="safety-guidelines">100% Safe &amp; Non-Toxic Materials</div>
      <div class="quantity-selector">
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" value="1" min="1" />
      </div>
      <div class="product-actions">
        <button class="btn-primary" id="add-to-cart">Add to Cart</button>
        <button class="btn-secondary" id="buy-now">Buy Now</button>
      </div>
    </div>
  </div>

  <section class="related-products">
    <h2>Recommended Toys</h2>
    <div class="related-products-grid">
      <div class="product-card" tabindex="0">
        <img src="https://images.unsplash.com/photo-1560807707-8cc77767d783?auto=format&fit=crop&w=400&q=80" alt="Plush Doll" />
        <h3>Plush Doll</h3>
        <div class="price">$25.00</div>
        <button class="btn-quick-buy">Quick Buy</button>
      </div>
      <div class="product-card" tabindex="0">
        <img src="https://images.unsplash.com/photo-1504595403659-9088ce801e29?auto=format&fit=crop&w=400&q=80" alt="Puzzle Game" />
        <h3>Puzzle Game</h3>
        <div class="price">$40.00</div>
        <button class="btn-quick-buy">Quick Buy</button>
      </div>
      <div class="product-card" tabindex="0">
        <img src="https://images.unsplash.com/photo-1519125323398-675f0ddb6308?auto=format&fit=crop&w=400&q=80" alt="Board Game" />
        <h3>Board Game</h3>
        <div class="price">$34.99</div>
        <button class="btn-quick-buy">Quick Buy</button>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container footer-container">
    <div class="footer-left">
      <h3>WonderToys</h3>
      <p>Bringing joy to playtime!</p>
    </div>
    <div class="footer-right">
      <div class="social-links">
        <a href="#" aria-label="Facebook"><img src="https://img.icons8.com/color/48/000000/facebook-new.png" alt="Facebook" /></a>
        <a href="#" aria-label="Twitter"><img src="https://img.icons8.com/color/48/000000/twitter.png" alt="Twitter" /></a>
        <a href="#" aria-label="Instagram"><img src="https://img.icons8.com/color/48/000000/instagram-new.png" alt="Instagram" /></a>
      </div>
      <form class="newsletter-form" aria-label="Subscribe to newsletter">
        <input type="email" placeholder="Your email address" aria-label="Email address" required />
        <button type="submit">Subscribe</button>
      </form>
    </div>
  </div>
</footer>

</body>
</html>
