<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ByteCafe Menu</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
  <div class="container">
    <h2>Our Signature Coffee & Pastries</h2>
    <div class="grid">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Signature Espresso" />
        <h3>Signature Espresso</h3>
        <p>$4.00</p>
        <button>Order Now</button>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Silky Cappuccino" />
        <h3>Silky Cappuccino</h3>
        <p>$5.00</p>
        <button>Order Now</button>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1498804103079-a6351b050096?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Caffe Latte" />
        <h3>Caffe Latte</h3>
        <p>$5.50</p>
        <button>Order Now</button>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Iced Caramel Macchiato" />
        <h3>Iced Caramel Macchiato</h3>
        <p>$6.00</p>
        <button>Order Now</button>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1521302080370-1e88b7c9ef4c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Velvet Mocha" />
        <h3>Velvet Mocha</h3>
        <p>$6.50</p>
        <button>Order Now</button>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1532634726-9f5f3dfd3767?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Nitro Cold Brew" />
        <h3>Nitro Cold Brew</h3>
        <p>$7.00</p>
        <button>Order Now</button>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1542831371-29b0f74f9713?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Croissant" />
        <h3>Croissant</h3>
        <p>$3.50</p>
        <button>Order Now</button>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1516684669134-de6f2d9d4e29?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Muffin" />
        <h3>Muffin</h3>
        <p>$3.00</p>
        <button>Order Now</button>
      </div>
    </div>
  </div>
  <style>
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: var(--soft-cream);
      box-shadow: 0 4px 15px rgba(198, 146, 68, 0.3);
      border-radius: 12px;
      overflow: hidden;
      padding-bottom: 1rem;
      text-align: center;
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 30px rgba(198, 146, 68, 0.5);
    }
    .card h3 {
      margin: 1rem 0 0.5rem;
      font-family: 'Playfair Display', serif;
      color: var(--deep-espresso);
    }
    .card p {
      font-weight: 600;
      color: var(--caramel-gold);
      margin: 0.25rem 0 1rem;
    }
    .card button {
      background-color: var(--caramel-gold);
      border: none;
      padding: 0.5rem 1.5rem;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      color: var(--deep-espresso);
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .card button:hover {
      background-color: #b07f2a;
    }
  </style>
</body>
</html>
