<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew & Bean Cafe - Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="container">
        <div class="logo">Brew & Bean Cafe</div>
        <nav>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html" class="active">Shop/Menu</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><button id="cart-button">Cart (<span id="cart-count">0</span>)</button></li>
                <li class="nav-toggle"><button id="nav-toggle-btn" aria-label="Toggle navigation">&#9776;</button></li>
            </ul>
        </nav>
    </div>
</header>
<main class="container">
    <h1>Our Menu</h1>
    <div class="category-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="hot">Hot Coffees</button>
        <button class="filter-btn" data-filter="cold">Cold Brews</button>
        <button class="filter-btn" data-filter="bakery">Pastries</button>
    </div>
    <section class="product-grid" id="product-grid">
        <!-- Product cards rendered by JS -->
    </section>
</main>
<script src="script.js"></script>
<footer>
    <p>&copy; 2024 Brew & Bean Cafe. All rights reserved.</p>
</footer>
</body>
</html>
