<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ByteCafe Menu</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Poppins&display=swap" rel="stylesheet" />
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="index.html">ByteCafe</a></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <main class="menu-container" style="padding: 2rem 4rem; max-width: 1200px; margin: auto;">
        <h1 style="font-family: 'Playfair Display', serif; color: #1e120b; text-align: center; margin-bottom: 2rem;">Our Luxurious Coffee & Treats</h1>
        <div class="grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem;">
            <!-- Coffee & Treats Cards -->
            <div class="card">
                <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=500&q=80" alt="Signature Espresso" />

                </div>
            </div>

                    <p class="card-price">$5.50</p>
                    <button class="card-button">Order Now</button>

                    <p class="card-price">$5.75</p>

                    <h2 class="card-title">Nitro Cold Brew</h2>
