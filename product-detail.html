<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product Detail - Toykart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header container">
    <div class="hero-grid container">
      <div class="logo">Toykart</div>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="products.html" class="active">Products</a>
        <a href="cart.html">Cart <span class="cart-count">0</span></a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="product-detail" class="product-detail">
      <div id="pd-gallery">
        <img id="pd-image" src="" alt="product">
        <div id="pd-thumbs"></div>
      </div>
      <div id="pd-info">
        <h1 id="pd-title">Product name</h1>
        <div id="pd-price" class="price">₹0</div>
        <p id="pd-desc">Description goes here.</p>
        <p>Age: <span id="pd-age"></span></p>
        <div class="pd-actions">
          <label>Qty: <input id="pd-qty" type="number" min="1" value="1" class="qty-input"></label>
          <button id="pd-add" class="btn add-to-cart">Add to Cart</button>
          <button id="pd-buy" class="btn btn-primary">Buy Now</button>
        </div>
      </div>
    </section>

    <section class="related">
      <h3>You may also like</h3>
      <div id="related-list" class="featured-grid"></div>
    </section>
  </main>

  <footer class="site-footer container">
    <div>© Toykart - Toys only store</div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
