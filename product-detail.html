<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product Detail - ToyLand World</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo"><img src="https://images.unsplash.com/photo-1566576912321-d58ddd7a6088?w=1200" alt="logo"><h1>ToyLand World</h1></div>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart</a>
        <button class="icon-btn"><span>♡</span><span class="wish-count">0</span></button>
        <button class="icon-btn"><span>🛒</span><span class="cart-count">0</span></button>
      </nav>
      <button id="mobile-toggle" class="mobile-toggle">☰</button>
    </div>
  </header>

  <main class="container">
    <div class="product-detail">
      <div class="gallery"><img src="" alt="product" id="pd-img"></div>
      <div class="info">
        <h2></h2>
        <p class="desc"></p>
        <div class="price"></div>
        <div class="stock"></div>
        <div class="qty"><button class="minus">-</button><input type="number" min="1" value="1"><button class="plus">+</button></div>
        <div style="margin-top:12px"><button class="add-to-cart">Add to Cart</button></div>
      </div>
    </div>
  </main>

  <footer class="footer">&copy; 2026 ToyLand World</footer>
  <script src="script.js"></script>
  <script>
    // PRODUCT list available as window.PRODUCTS
    loadProductDetail(window.PRODUCTS || []);
  </script>
</body>
</html>
