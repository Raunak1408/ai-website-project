<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product Detail — ToyNest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="hero-grid container">
      <div class="logo">ToyNest</div>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart <span class="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section id="product-detail" class="product-detail">
      <div id="pd-gallery"></div>
      <div id="pd-info">
        <h1 id="pd-title">Product name</h1>
        <div id="pd-price" class="price">$0</div>
        <div id="pd-desc">Description goes here.</div>
        <p>Category: <span id="pd-category"></span></p>
        <p>Age: <span id="pd-age"></span></p>
        <p id="pd-availability">Availability: In stock</p>
        <label>Quantity: <input id="pd-qty" type="number" min="1" value="1"></label>
        <div class="pd-actions">
          <button id="pd-add" class="btn add-to-cart">Add to Cart</button>
          <button id="pd-buy" class="btn btn-primary">Buy Now</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer container">
    <div>ToyNest — Premium toys for curious kids</div>
    <nav>
      <a href="products.html">Products</a> ·
      <a href="about.html">About</a> ·
      <a href="contact.html">Contact</a>
    </nav>
    <div>© ToyNest</div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
