<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product Detail — ToyNest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="product-detail-page">
  <header class="site-header">
    <div class="container" style="max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:14px 16px;">
      <div class="logo">ToyNest</div>
      <button class="nav-toggle" aria-controls="main-navigation" aria-expanded="false" aria-label="Open menu"><span class="hamburger"></span></button>
      <nav id="main-navigation" class="nav main-nav" aria-hidden="false">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html" class="cart-link">Cart <span class="cart-count">0</span></a>
      </nav>
    </div>
  </header>

  <main>
    <section class="container">
      <div id="pd">
        <div id="pd-image"><img id="pd-image-img" alt="Product image"></div>
        <div id="pd-info" class="pd-info">
          <h2 id="pd-title">Product title</h2>
          <div style="display:flex;gap:12px;align-items:center;"> <div id="pd-price" class="price">$0.00</div> <div id="pd-rating" class="small">★ 0</div></div>
          <p id="pd-desc" class="small" style="margin-top:12px">Product description</p>
          <div style="margin-top:12px">Category: <span id="pd-category">-</span></div>
          <div class="small">Age: <span id="pd-age">-</span></div>
          <div class="small">Availability: <span id="pd-availability">-</span></div>

          <div style="margin-top:14px;display:flex;gap:12px;align-items:center">
            <div id="pd-qty">
              <button id="pd-decrease">-</button>
              <input id="pd-qty" type="number" value="1" min="1" style="width:56px;text-align:center;border-radius:8px;padding:6px;border:1px solid rgba(10,25,47,0.06)">
              <button id="pd-increase">+</button>
            </div>
            <div style="display:flex;gap:8px">
              <button id="pd-add" class="btn">Add to Cart</button>
              <button id="pd-buy" class="btn btn-primary">Buy Now</button>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">ToyNest — Premium toys for curious kids.</div>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
