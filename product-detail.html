<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Product — ToyLand World</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="index.html">ToyLand World</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart</a>
      </nav>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="icon-btn">🔍</button>
        <a class="icon-btn" href="wishlist.html">❤ <span class="badge wish-count">0</span></a>
        <a class="icon-btn" href="cart.html">🛒 <span class="badge cart-count">0</span></a>
        <button class="mobile-toggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="product-detail">
      <div class="gallery">
        <div id="galleryMain" class="gallery-main"></div>
        <div class="gallery-thumbs">
          <div class="thumb active" data-src="https://images.unsplash.com/photo-1587654562363-6054a493c3d6?w=600" style="background-image:url('https://images.unsplash.com/photo-1587654562363-6054a493c3d6?w=600')"></div>
          <div class="thumb" data-src="https://images.unsplash.com/photo-1559454403-b8fb88521f11?w=600" style="background-image:url('https://images.unsplash.com/photo-1559454403-b8fb88521f11?w=600')"></div>
          <div class="thumb" data-src="https://images.unsplash.com/photo-1594787318286-3d835c1d207f?w=600" style="background-image:url('https://images.unsplash.com/photo-1594787318286-3d835c1d207f?w=600')"></div>
        </div>
      </div>
      <div>
        <h1 id="pd-title">Product Title</h1>
        <div id="pd-price">$0.00</div>
        <p id="pd-desc">Description</p>
        <div><strong>Stock:</strong> <span id="pd-stock">In Stock</span></div>
        <div class="detail-actions">
          <div class="qty"><button id="pd-minus">-</button><span id="pd-qty">1</span><button id="pd-plus">+</button></div>
          <button class="btn" id="pd-add">Add to Cart</button>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer container">© ToyLand World</footer>

  <script src="app.js"></script>
  <script>document.addEventListener('DOMContentLoaded',()=>{if(typeof initProductDetail==='function')initProductDetail();});</script>
</body>
</html>
